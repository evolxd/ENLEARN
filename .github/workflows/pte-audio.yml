# 放在仓库的 .github/workflows/pte-audio.yml
# 用法：GitHub → Actions → "PTE 配音生成" → Run workflow（手机网页也可以按）
name: PTE 配音生成

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只重新生成指定题号，如 3,7（留空＝全部 27 题）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests lameenc

      - name: 恢复配音缓存
        uses: actions/cache@v4
        with:
          path: tts_cache
          key: pte-tts-${{ hashFiles('pte-describe-image/index.html') }}-${{ github.run_id }}
          restore-keys: pte-tts-${{ hashFiles('pte-describe-image/index.html') }}-

      - name: 生成配音
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          python tools/generate_pte_audio.py pte-describe-image/index.html $ARGS

      - name: 提交配音回仓库
        run: |
          git config user.name "voiceover-bot"
          git config user.email "voiceover-bot@users.noreply.github.com"
          git add pte-describe-image/audio/*.mp3
          git commit -m "重新生成 PTE Describe Image 配音" || echo "没有变更"
          git push
