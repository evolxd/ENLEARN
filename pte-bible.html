<head>

  <style>

  </style>

<body>
  <div class="container">
    <div class="header">
      <h1>🎧 PTE 发音圣经</h1>
      <p>500个高频词汇 + ElevenLabs 文本转语音</p>
    </div>

    <div class="config">
      <h2>⚙️ ElevenLabs 配置</h2>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk_...">
      </div>
      <button class="btn" onclick="saveKey()">💾 保存</button>
      <button class="btn" onclick="download()">⬇️ 下载</button>
      <div id="msg" class="message"></div>
    </div>

    <input type="text" class="search-box" id="search" placeholder="搜索..." oninput="search()">
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

:"compare with optimistic for the -ic stress shift","evidence":"Hypothesis","freq":"Medium-High","qtypes":"Read Aloud, Essay","example":"\"His optimism motivated the whole team.\"","shadowing":"Drill medial /z/ and the final cluster separately","practice":"Say *optimism* and *optimistic* in sequence to feel the stress shift"},{"n":495,"word":"resilient","pos":"adjective","meaning":"able to recover quickly from difficulty","zh":"有韧性的","related":"resilience (n.)","difficulty":"High","notes":"stress-stable pair","ipa":"/rɪˈzɪljənt/","syll":"3","stress":"primary on syllable 2 (no shift to resilience)","primarySyll":"2","mistakes":"medial /z/ possibly devoiced to /s/; /lj/ glide dropped; final \"-jənt\" cluster","learnerError":"z→s devoicing risk; glide-cluster risk","errorType":"consonant","correction":"drill medial /z/, the /lj/ glide, and the final cluster","aiNote":"common in personal-experience Essay/Respond to a Situation content","evidence":"Hypothesis","freq":"Medium","qtypes":"Read Aloud, Essay","example":"\"Children are often remarkably resilient.\"","shadowing":"Drill medial /z/, the /lj/ glide, and the final cluster","practice":"Compare against *resilience* below — this pair does not shift stress"},{"n":496,"word":"resilience","pos":"noun","meaning":"the ability to recover quickly from difficulty","zh":"韧性；适应力","related":"resilient (adj.)","difficulty":"High","notes":"third stress-stable -ent/-ence pair","ipa":"/rɪˈzɪljəns/","syll":"3","stress":"primary on syllable 2 (no shift from resilient)","primarySyll":"2","mistakes":"medial /z/ possibly devoiced to /s/; /lj/ glide dropped; final \"-ns\" cluster","learnerError":"z→s devoicing risk; glide-cluster risk; consonant cluster simplification","errorType":"consonant","correction":"drill medial /z/, the glide, and the final cluster","aiNote":"a third stress-stable -ent/-ence pair, alongside confident/confidence","evidence":"Hypothesis","freq":"Medium","qtypes":"Read Aloud, Essay","example":"\"The company showed resilience during the economic downturn.\"","shadowing":"Drill medial /z/, the glide, and the final cluster","practice":"Compare against *confident*/*confidence* above for the shared stability pattern"},{"n":497,"word":"empathy","pos":"noun","meaning":"the ability to understand and share the feelings of another","zh":"同理心；共情","related":"empathetic (adj.); empathize (v.)","difficulty":"Medium","notes":"","ipa":"/ˈɛmpəθi/","syll":"3","stress":"primary on syllable 1 (shifts in empathetic)","primarySyll":"1","mistakes":"/θ/ produced as /s/; medial \"-mp-\" cluster","learnerError":"θ→s substitution (Part IV Ch.1 Mistake 1); consonant cluster simplification","errorType":"consonant","correction":"drill medial \"-mp-\", then /θ/","aiNote":"compare with empathetic for the -ic stress shift","evidence":"Hypothesis","freq":"Medium-High","qtypes":"Read Aloud, Essay","example":"\"Empathy is an important skill for counselors.\"","shadowing":"Drill medial \"-mp-\", then /θ/","practice":"Say *empathy* and *empathetic* in sequence to feel the stress shift"},{"n":498,"word":"empathetic","pos":"adjective","meaning":"showing empathy","zh":"有同理心的","related":"empathy (n.); empathize (v.)","difficulty":"High","notes":"seventh and final -ic family shift pair","ipa":"/ˌɛmpəˈθɛtɪk/","syll":"4","stress":"secondary on syllable 1, primary on syllable 3 (-ic rule, shift from empathy)","primarySyll":"3","mistakes":"/θ/ produced as /s/; applying empathy's stress instead of shifting","learnerError":"θ→s substitution; wrong-syllable stress if -ic shift not applied (Part IV Ch.1 Mistake 1, Ch.2 Mistake 3)","errorType":"consonant, stress","correction":"drill /θ/, then confirm stress falls before -ic","aiNote":"seventh and final -ic family shift pair documented in this lexicon's first 500 words","evidence":"Hypothesis","freq":"Medium","qtypes":"Read Aloud, Essay","example":"\"A good doctor is empathetic toward patients.\"","shadowing":"Drill /θ/, then confirm stress falls before \"-ic\"","practice":"Say *empathy* and *empathetic* in sequence to feel the stress shift"},{"n":499,"word":"gratitude","pos":"noun","meaning":"the quality of being thankful","zh":"感激；感恩","related":"grateful (adj.)","difficulty":"Medium","notes":"","ipa":"/ˈɡrætɪtuːd/","syll":"3","stress":"primary on syllable 1","primarySyll":"1","mistakes":"dense initial \"-gr-\" cluster; final \"-tuːd\" cluster","learnerError":"consonant cluster simplification, two sites (Part IV Ch.1 Mistake 4)","errorType":"consonant","correction":"drill both consonant clusters separately","aiNote":"common in personal-reflection Essay/Respond to a Situation content","evidence":"Hypothesis","freq":"Medium","qtypes":"Read Aloud, Essay","example":"\"She expressed her gratitude to her mentors.\"","shadowing":"Drill both consonant clusters separately","practice":"Compare against *grateful* below in a personal-topic sentence"},{"n":500,"word":"grateful","pos":"adjective","meaning":"feeling or showing thanks","zh":"感激的","related":"gratitude (n.); gratefully (adv.)","difficulty":"Medium","notes":"","ipa":"/ˈɡreɪtfəl/","syll":"2","stress":"primary on syllable 1","primarySyll":"1","mistakes":"diphthong /eɪ/ shortened; final syllabic /l/ weakened; dense \"-tfəl\" cluster","learnerError":"diphthong monophthongization; syllable-final /l/ weakening; consonant cluster simplification (Part IV Ch.5 Mistake 2, Ch.1 Mistakes 4 and 5)","errorType":"vowel, consonant","correction":"drill the diphthong, then the dense final cluster","aiNote":"very high frequency in personal-reflection Essay/Respond to a Situation content — a natural closing word for this lexicon's final batch","evidence":"Hypothesis","freq":"High","qtypes":"Read Aloud, Essay","example":"\"I am grateful for your support.\"","shadowing":"Drill the diphthong, then the dense final cluster","practice":"Compare against *gratitude* above in a personal-topic sentence"}];
    const CHAPTERS = {"part4":{"label":"Part IV · 中国学习者错误库","chapters":[{"id":"part4-01_top-pronunciation-mistakes","title":"1. Top Pronunciation Mistakes（发音高频错误）","meta":{"part":"Part IV — Chinese Error Corpus","status":"Draft","accent":"General American (GA), consistent with Part II"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>Identify the five most consistently documented segmental (individual-sound) pronunciation errors made by Mandarin L1 speakers of English.</li>\n<li>Explain the phoneme-inventory or syllable-structure mechanism behind each error, using the terminology from Part II.</li>\n<li>Distinguish which of these errors risk changing Content (a different word is perceived) versus only lowering the Pronunciation band.</li>\n<li>Apply targeted minimal-pair drills to each error pattern.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses terms defined in Part II Ch.2 (Consonants) — phoneme, place/manner of articulation, coda, epenthesis — rather than redefining them. New terms specific to this chapter:</p>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>L1 Transfer</td>\n<td>母语迁移</td>\n<td>Applying a first-language sound pattern to a second language.</td>\n</tr>\n<tr>\n<td>Segmental Error</td>\n<td>音段错误</td>\n<td>An error affecting an individual sound (as opposed to stress or rhythm, covered in Ch.2–3 of this Part).</td>\n</tr>\n<tr>\n<td>Nearest-Neighbor Substitution</td>\n<td>近似音替代</td>\n<td>Replacing a missing target phoneme with the closest sound that does exist in the speaker's L1 inventory.</td>\n</tr>\n</tbody>\n</table>\n<h3>Why these five errors recur so consistently</h3>\n<p>Second-language phoneme substitution is not random: learners overwhelmingly substitute the closest sound available in their first language for a target sound their first language lacks, rather than inventing a new, unrelated sound <span class=\"tag tag-linguistics\">Linguistics</span>. Because Mandarin's phoneme inventory and syllable structure differ from English's in specific, well-documented ways (Part II Ch.2), the resulting substitution patterns are highly predictable across Mandarin L1 speakers rather than idiosyncratic to each learner.</p>\n<h3>Mistake 1 — /θ/, /ð/ → /s/, /z/ or /d/ (\"think\" → \"sink\", \"this\" → \"dis\")</h3>\n<ul>\n<li><strong>Mechanism</strong>: Mandarin has no dental fricatives; /θ/ and /ð/ do not exist in its phoneme inventory (Part II Ch.2). Learners substitute the closest sound they have — most commonly /s/ for /θ/ and /d/ or /z/ for /ð/ <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li><strong>Risk level</strong>: Content risk — \"think\"/\"sink\" and similar pairs are different real English words, so this substitution can be scored as a wrong word, not only a Pronunciation-band reduction (Part I Ch.4).</li>\n<li><strong>Correction target</strong>: tongue-tip-between-teeth articulation, practiced explicitly rather than approximated from /s/ or /d/.</li>\n</ul>\n<h3>Mistake 2 — /v/ → /w/ (\"very\" → \"wery\")</h3>\n<ul>\n<li><strong>Mechanism</strong>: Mandarin has no labiodental /v/; /w/ is the nearest sound in the learner's inventory, so /v/ is frequently produced as /w/ <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li><strong>Risk level</strong>: Content risk for minimal pairs like <em>vine/wine</em>, <em>vet/wet</em>.</li>\n<li><strong>Correction target</strong>: top-teeth-on-bottom-lip contact for /v/ (a fricative, with audible friction), versus rounded lips with no tooth contact for /w/ (a glide).</li>\n</ul>\n<h3>Mistake 3 — Word-final consonant deletion or vowel insertion (\"bag\" → \"ba\" or \"ba-guh\")</h3>\n<ul>\n<li><strong>Mechanism</strong>: Mandarin syllables can only end in a vowel, /n/, /ŋ/, or a glide; other final consonants have no permitted coda slot (Part II Ch.2). Learners either delete the disallowed final consonant or insert a vowel after it (epenthesis) to force the syllable into an allowed Mandarin pattern <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li><strong>Risk level</strong>: Content risk (a deleted final consonant can produce a different or unrecognizable word) and Pronunciation-band risk if it happens systematically.</li>\n<li><strong>Correction target</strong>: producing the final consonant's closure/articulation without releasing into a vowel — this is the same skill target as Part II Ch.9 (Incomplete Plosion), applied here to single word-final consonants rather than consonant-plus-consonant sequences.</li>\n</ul>\n<h3>Mistake 4 — Consonant cluster simplification (\"asked\" → \"as\" or \"as-kuh\")</h3>\n<ul>\n<li><strong>Mechanism</strong>: Mandarin permits no consonant clusters at all <span class=\"tag tag-linguistics\">Linguistics</span>. Faced with an English cluster (e.g. /skt/ in <em>asked</em>), learners typically either delete one or more consonants, keeping whichever is most acoustically salient, or insert a vowel between cluster members to break it into separately permitted syllables <span class=\"tag tag-practice\">Practice</span>.</li>\n<li><strong>Risk level</strong>: Content risk, particularly for grammatical endings (past tense <em>-ed</em>, plural/third-person <em>-s</em>) that are frequently the cluster-final consonant being dropped — this can also produce grammar-level miscommunication, not just a pronunciation issue.</li>\n<li><strong>Correction target</strong>: practicing cluster production as a single continuous articulatory sequence, without an inserted vowel.</li>\n</ul>\n<h3>Mistake 5 — Syllable-final /l/ weakening or deletion (\"feel\" → \"fee\" or a vocalized, vowel-like /l/)</h3>\n<ul>\n<li><strong>Mechanism</strong>: this pattern is documented in the research literature on Mandarin speakers' production of syllable-final /l/, reflecting the same broader coda-restriction issue as Mistake 3 — Mandarin coda consonants are limited to nasals and a retroflex approximant, not /l/ <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li><strong>Risk level</strong>: Content risk for pairs like <em>feel/fee</em>, <em>call/caw</em>.</li>\n<li><strong>Correction target</strong>: maintaining full tongue-tip-to-alveolar-ridge contact through the end of the syllable, rather than letting the /l/ weaken toward a vowel-like glide.</li>\n</ul>\n<h2>Examples</h2>\n<table>\n<thead>\n<tr>\n<th>Target</th>\n<th>IPA</th>\n<th>Common substitution</th>\n<th>Mistake #</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>think</td>\n<td>/θɪŋk/</td>\n<td>\"sink\" /sɪŋk/</td>\n<td>1</td>\n</tr>\n<tr>\n<td>very</td>\n<td>/ˈveri/</td>\n<td>\"wery\" /ˈweri/</td>\n<td>2</td>\n</tr>\n<tr>\n<td>bag</td>\n<td>/bæg/</td>\n<td>\"ba\" / \"ba-guh\"</td>\n<td>3</td>\n</tr>\n<tr>\n<td>asked</td>\n<td>/æskt/</td>\n<td>\"as\" / \"as-kuh\"</td>\n<td>4</td>\n</tr>\n<tr>\n<td>feel</td>\n<td>/fiːl/</td>\n<td>\"fee\"</td>\n<td>5</td>\n</tr>\n</tbody>\n</table>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Prioritize Mistakes 1–3 for drilling first: they carry the highest documented frequency and the clearest Content-error risk in scored PTE responses.</li>\n<li>When previewing a Read Aloud or Repeat Sentence passage, scan specifically for words containing /θ/, /ð/, /v/, or word-final consonants/clusters — these are the highest-risk words in the passage, not a random subset.</li>\n<li>Do not treat these as accent features to be tolerated (Part I Ch.2 distinguishes accent from error) — these are documented phonemic substitutions with Content-level consequences, and are worth dedicated correction time.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Record the five example words above and compare your production against the target IPA. Identify which of the five mistakes appear in your own speech.</li>\n<li>Build a 10-word list of your own PTE vocabulary containing /θ/ or /ð/, and drill each with the correct tongue-between-teeth articulation.</li>\n<li>Take a short passage and mark every word with a final consonant cluster. Practice each without inserting a vowel or dropping a cluster member.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Segmental errors follow predictable L1-transfer patterns: learners substitute the nearest available L1 sound for a missing target phoneme <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li>The five most consistently documented Mandarin L1 segmental errors: θ/ð substitution, v→w substitution, final-consonant deletion/epenthesis, consonant-cluster simplification, and syllable-final /l/ weakening.</li>\n<li>Several of these carry Content-level risk (a different word is perceived), not only a Pronunciation-band reduction — connecting directly to Part I Ch.4.</li>\n<li>Correction targets are specific and trainable: articulatory placement, not generic \"practice more\" advice.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Zhang, F. \"Think or Sink: Chinese Learners' Acquisition of the English Voiceless Interdental Fricative.\" https://www.researchgate.net/publication/227681224_Think_or_Sink_Chinese_Learners'_Acquisition_of_the_English_Voiceless_Interdental_Fricative</li>\n<li>\"A Study of Pronunciation Problems of English Learners in China.\" https://www.researchgate.net/publication/41846520_A_Study_of_Pronunciation_Problems_of_English_Learners_in_China</li>\n<li>\"Production of English Syllable Final /l/ by Mandarin Chinese Speakers.\" https://www.academypublication.com/issues/past/jltr/vol05/04/03.pdf — this session could not fetch the full text (403 on direct fetch); cited for its documented title/topic only, cross-referenced against the general coda-restriction finding in source 4 below. Verify full content when accessible.</li>\n<li>TALK Schools. \"Most Common Pronunciation Errors That Chinese Speakers Make When Speaking English.\" https://blog.talk.edu/learn-english/common-pronunciation-errors-chinese-speakers/</li>\n<li>Pronunciation Studio. \"10 English Pronunciation Errors by Mandarin Speakers.\" https://pronunciationstudio.com/mandarin-speakers-english-pronunciation-errors/</li>\n<li>Cross-reference: Part II Ch.2 (Consonants) for the underlying phoneme-inventory and syllable-structure facts this chapter builds on.</li>\n</ol>"},{"id":"part4-02_top-stress-mistakes","title":"2. Top Stress Mistakes（重音高频错误）","meta":{"part":"Part IV — Chinese Error Corpus","status":"Draft","accent":"General American (GA), consistent with Part II"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>Explain why Mandarin's tonal system, rather than a stress system, predicts specific English stress errors.</li>\n<li>Identify the difference between using pitch alone versus using the full stress bundle (pitch, length, loudness, vowel quality) to mark a stressed syllable.</li>\n<li>Recognize \"equal stress\" and \"wrong-syllable stress\" as the two dominant error types documented in the research literature.</li>\n<li>Apply targeted correction techniques distinct from those used for the segmental errors in Ch.1.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses stress terminology defined in Part II Ch.4 (Word Stress) — primary stress, secondary stress, lexical stress, stress shift — rather than redefining it. New terms specific to this chapter:</p>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tone (lexical)</td>\n<td>声调</td>\n<td>In Mandarin, a pitch contour that distinguishes word meaning — a different mechanism from English stress (Part II Ch.4).</td>\n</tr>\n<tr>\n<td>Equal Stress Error</td>\n<td>平均重音错误</td>\n<td>Producing all syllables of a word with similar prominence instead of one clearly stressed syllable.</td>\n</tr>\n<tr>\n<td>Stress-as-Tone Transfer</td>\n<td>声调化重音迁移</td>\n<td>Using pitch alone (in a tone-like way) to mark stress, rather than the full native stress bundle.</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Mandarin's tone system predicts specific stress errors</h3>\n<p>Mandarin is a tonal language: pitch contour on each syllable is itself a phonemic feature that distinguishes word meaning, and Mandarin does not have an English-style system where one syllable is stressed and others are unstressed within a word <span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.4). Because Mandarin speakers learn to attend to pitch for lexical meaning rather than for marking prominence, research on Mandarin EFL learners identifies two recurring, related error types when they produce English stress.</p>\n<h3>Mistake 1 — Equal stress (\"failure to differentiate stressed and unstressed syllables\")</h3>\n<p>Research on Mandarin EFL learners' acquisition of English word stress identifies \"negative transfer of mother language, failure to be sensitive to vowel length, and overgeneralization of English word stress assignment rules\" as central causes of stress errors <span class=\"tag tag-linguistics\">Linguistics</span>. Because Chinese tone assignment operates independently of a stressed/unstressed contrast, learners often produce each syllable of a multisyllabic word with comparable length and prominence, rather than concentrating stress on one syllable and reducing the others <span class=\"tag tag-linguistics\">Linguistics</span> — this is the same underlying mechanism introduced in Part II Ch.4 and Ch.5, now identified specifically in the research literature as a documented, not merely anecdotal, error pattern.</p>\n<h3>Mistake 2 — Marking stress with pitch alone, in a tone-like way</h3>\n<p>Acoustic research comparing Chinese-dialect speakers' production of English lexical stress to native speakers found that Chinese-speaking participants relied heavily on pitch cues and used inflexible pitch patterns across different stress positions, \"producing English stress as tone\" — in one documented pattern, using a level high tone with unusually long duration to indicate a stressed syllable <span class=\"tag tag-linguistics\">Linguistics</span>. This differs from native English stress, which is marked by a <em>bundle</em> of cues together — pitch, length, loudness, and full (non-reduced) vowel quality (Part II Ch.4) — not by pitch in isolation. A learner who only raises pitch on the target syllable, without also lengthening it and keeping neighboring syllables reduced, produces a stress pattern that sounds tonal rather than stressed.</p>\n<h3>Mistake 3 — Wrong-syllable stress from overgeneralized rules</h3>\n<p>Because English stress is only partially rule-governed (Part II Ch.4), learners sometimes overgeneralize a pattern learned from one word family to a different word that does not follow it <span class=\"tag tag-linguistics\">Linguistics</span>. This differs from Mistake 1 (even prominence across syllables) — here, one syllable is clearly stressed, but it is the wrong one, changing the word's identity (e.g., <em>record</em> the noun vs <em>record</em> the verb, Part II Ch.4) rather than just its naturalness.</p>\n<h2>Examples</h2>\n<table>\n<thead>\n<tr>\n<th>Word</th>\n<th>Correct stress</th>\n<th>Common Mandarin-L1 error pattern</th>\n<th>Mistake #</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>photograph</td>\n<td>/ˈfoʊtəɡræf/</td>\n<td>All three syllables produced with similar length/prominence</td>\n<td>1</td>\n</tr>\n<tr>\n<td>important</td>\n<td>/ɪmˈpɔːrtənt/</td>\n<td>Pitch raised on target syllable but without matching length/vowel reduction elsewhere</td>\n<td>2</td>\n</tr>\n<tr>\n<td>present (noun)</td>\n<td>/ˈprezənt/</td>\n<td>Stressed as /prɪˈzent/ (verb pattern applied to the noun)</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2>Exam Strategy</h2>\n<ul>\n<li>When marking a new word's stress (Part III), check not only <em>which</em> syllable is stressed but <em>how</em> — plan to combine pitch, length, and full vowel quality on that syllable, and reduce the others (Part II Ch.7), rather than relying on pitch alone.</li>\n<li>For noun/verb stress pairs, treat correct stress as equivalent to a Content-level distinction (Part I Ch.4) — a stress error here is not merely an accent feature.</li>\n<li>Exaggerate the length and vowel-reduction contrast during drilling, not just the pitch contrast — Mistake 2 shows that pitch alone is not a sufficient substitute for the full native stress bundle.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Record a four-syllable word. Measure (by ear, or with any available audio tool) whether the stressed syllable is both longer and louder than the others, or only higher in pitch.</li>\n<li>Take three noun/verb stress-pair words (e.g. <em>present</em>, <em>record</em>, <em>permit</em>) and drill both forms, checking that the unstressed syllables reduce toward schwa (Part II Ch.7) rather than keeping a full vowel.</li>\n<li>Identify one word in your own vocabulary where you may be applying a stress pattern learned from a different, similar-looking word (Mistake 3), and verify the correct pattern against a dictionary.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Mandarin's tonal system does not include an English-style stressed/unstressed contrast, predicting two documented, distinct error types <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li>Equal stress (Mistake 1): syllables produced with similar prominence instead of one standing out.</li>\n<li>Stress-as-tone (Mistake 2): stress marked with pitch alone, without the accompanying length and vowel-quality cues native stress requires.</li>\n<li>Wrong-syllable stress (Mistake 3): a rule overgeneralized from a different word family, changing word identity.</li>\n<li>Correct stress is a scored Pronunciation criterion independent of accent (Part I Ch.1–2), so these errors carry real, documented scoring consequences.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>\"The Acquisition of English Word Stress by Mandarin EFL Learners.\" https://files.eric.ed.gov/fulltext/EJ1160997.pdf</li>\n<li>\"A study of Chinese EFL learners' problems with stress acquisition.\" ScienceDirect. https://www.sciencedirect.com/science/article/abs/pii/S0346251X20307521</li>\n<li>\"Acoustic Correlates of English Lexical Stress Produced by Chinese Dialect Speakers Compared to Native English Speakers.\" Frontiers in Psychology / PMC. https://pmc.ncbi.nlm.nih.gov/articles/PMC8958030/</li>\n<li>\"Processing of word-level stress by Mandarin-speaking second language learners of English.\" Applied Psycholinguistics, Cambridge Core. https://www.cambridge.org/core/journals/applied-psycholinguistics/article/abs/processing-of-wordlevel-stress-by-mandarinspeaking-second-language-learners-of-english/024997529BA9DD8608F6308E0257224E</li>\n<li>Cross-reference: Part II Ch.4 (Word Stress) and Ch.5 (Sentence Rhythm) for the underlying stress and rhythm mechanisms this chapter builds on.</li>\n</ol>"},{"id":"part4-03_top-rhythm-mistakes","title":"3. Top Rhythm Mistakes（节奏高频错误）","meta":{"part":"Part IV — Chinese Error Corpus","status":"Draft","accent":"General American (GA), consistent with Part II"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>Explain why Mandarin's syllable-timed tendency, combined with the stress errors in Ch.2, produces a specific rhythmic error profile in English.</li>\n<li>Identify \"syllable-timed transfer\" and \"under-reduction of function words\" as the two dominant rhythm error types.</li>\n<li>Distinguish rhythm errors (this chapter) from segmental errors (Ch.1) and stress errors (Ch.2) that often co-occur with them.</li>\n<li>Apply chunking and reduction practice specifically targeted at these documented patterns.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses rhythm terminology defined in Part II Ch.5 (Sentence Rhythm) and Ch.7 (Reduction) — stress-timing, syllable-timing, content/function words, weak forms, schwa — rather than redefining it.</p>\n<h3>Why rhythm errors follow from Ch.1 and Ch.2's patterns</h3>\n<p>Rhythm errors in this chapter are not a separate, unrelated phenomenon — they are the sentence-level consequence of the segmental (Ch.1) and word-stress (Ch.2) patterns already documented. If individual syllables are not reliably reduced (Ch.2, Mistake 1: equal stress) and final consonants/clusters are handled inconsistently (Ch.1), the sentence-level rhythm that depends on clear stressed/unstressed contrast (Part II Ch.5) cannot be produced reliably either.</p>\n<h3>Mistake 1 — Syllable-timed transfer</h3>\n<p>Mandarin is typologically described as leaning toward syllable-timing, in contrast to English's stress-timed pattern <span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.5). This typological difference is directly identified in the research literature as a contributing factor in Mandarin speakers' English rhythm errors, alongside the equal-stress pattern from Ch.2 <span class=\"tag tag-linguistics\">Linguistics</span>. The practical result: English produced with each syllable given roughly similar duration, rather than compressed unstressed syllables clustering around prominent stressed beats.</p>\n<h3>Mistake 2 — Under-reduction of function words</h3>\n<p>Because syllable-timed transfer (Mistake 1) and equal word stress (Ch.2) both work against compressing unstressed material, function words frequently keep their strong forms in Mandarin-L1 English even in positions where native speech would use a weak form (Part II Ch.7) <span class=\"tag tag-practice\">Practice</span>. For example, <em>\"I want to go\"</em> produced with a full, unreduced /tuː/ for <em>to</em> rather than the weak /tə/. This is not a segmental error (the phoneme /t/, /uː/ are each individually \"correct\") — it is a rhythm-level error, because it violates the native pattern of which words carry full vowels and which do not.</p>\n<h3>Mistake 3 — Over-released plosives compounding staccato rhythm</h3>\n<p>Because Ch.1's final-consonant patterns and Part II Ch.9 (Incomplete Plosion) interact directly, Mandarin L1 speakers who add a release (or an inserted vowel) after word-final plosives, rather than leaving them unreleased before a following consonant, compound the syllable-timed impression documented in Mistake 1 — each added release or vowel effectively adds an extra beat of roughly equal weight, reinforcing the syllable-by-syllable delivery pattern rather than the native stressed-beat pattern.</p>\n<h2>Examples</h2>\n<p><em>\"I want to go to the store.\"</em></p>\n<ul>\n<li><strong>Documented Mandarin-L1 rhythm pattern</strong>: /aɪ wɒnt tuː ɡoʊ tuː ðə stɔːr/ — every word given roughly similar duration and full vowel quality, each word boundary clearly separated.</li>\n<li><strong>Native rhythm pattern</strong> (Part II Ch.5, Ch.7): /aɪ wɒnt tə ɡoʊ tə ðə stɔːr/ — content words (<em>want</em>, <em>go</em>, <em>store</em>) carry prominence; function words (<em>to</em>, <em>the</em>) reduce to weak forms; word boundaries link (Part II Ch.8) rather than separating cleanly.</li>\n</ul>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Treat rhythm correction as downstream of Ch.2 (stress) and Part II Ch.7 (reduction) practice — drilling isolated rhythm exercises without first fixing equal-stress and under-reduction habits tends not to transfer, since rhythm is the sentence-level expression of those word-level patterns.</li>\n<li>Before a Read Aloud response, identify content words (Part II Ch.5) and plan compression of the function words around them, rather than reading the sentence at a uniform pace.</li>\n<li>Self-check recordings specifically for \"every word sounds the same length\" as a diagnostic — if so, the underlying cause is very likely Mistake 1 or 2 above, not a speed problem.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Record the example sentence above. Measure (by ear) whether <em>want</em>, <em>go</em>, and <em>store</em> are noticeably longer/more prominent than <em>to</em> and <em>the</em>.</li>\n<li>Take a Read Aloud passage and mark every function word. Practice reducing each to its weak form (Part II Ch.7) while keeping content words full.</li>\n<li>Compare two recordings of the same sentence: one with full plosive releases throughout, one applying incomplete plosion (Part II Ch.9) at consonant-consonant boundaries. Note the rhythmic difference.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Rhythm errors are the sentence-level consequence of the segmental (Ch.1) and stress (Ch.2) patterns already documented in this Part, not an independent phenomenon.</li>\n<li>Mistake 1 (syllable-timed transfer) and Mistake 2 (under-reduction of function words) are the two dominant, research-documented rhythm error types for Mandarin L1 speakers <span class=\"tag tag-linguistics\">Linguistics</span>/<span class=\"tag tag-practice\">Practice</span>.</li>\n<li>Mistake 3 (over-released plosives) compounds the syllable-timed impression by adding extra perceived beats.</li>\n<li>Effective rhythm correction requires first addressing the underlying stress and reduction habits, not drilling rhythm in isolation.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>\"A study of Chinese EFL learners' problems with stress acquisition.\" ScienceDirect (typological stress-timed/syllable-timed contrast cited as a contributing factor). https://www.sciencedirect.com/science/article/abs/pii/S0346251X20307521</li>\n<li>\"Production of English connected speech processes: an assessment of Cantonese ESL learners' difficulties obtaining native-like speech.\" https://www.academia.edu/109559158/Production_of_English_connected_speech_processes_an_assessment_of_Cantonese_ESL_learners_difficulties_obtaining_native_like_speech — cited as related Chinese-L1 rhythm/connected-speech evidence.</li>\n<li>Cross-reference: Part II Ch.5 (Sentence Rhythm), Ch.7 (Reduction), and Ch.9 (Incomplete Plosion) for the underlying mechanisms this chapter builds on; Part IV Ch.1 and Ch.2 for the word-level patterns this chapter's rhythm errors follow from.</li>\n</ol>"},{"id":"part4-04_top-linking-mistakes","title":"4. Top Linking Mistakes（连读高频错误）","meta":{"part":"Part IV — Chinese Error Corpus","status":"Draft","accent":"General American (GA), consistent with Part II"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>Explain why the segmental patterns in Ch.1 (final-consonant deletion, epenthesis) directly interfere with the linking mechanisms in Part II Ch.8.</li>\n<li>Identify word-boundary pausing and missing consonant-to-vowel linking as the two dominant linking error types.</li>\n<li>Distinguish an intentional pause (acceptable, Part II Ch.3) from a habitual word-by-word break (a documented error pattern).</li>\n<li>Apply targeted linking drills that address the Ch.1 interaction directly.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses linking terminology defined in Part II Ch.8 (Linking) — consonant-to-vowel linking, linking /r/, intrusive glide — rather than redefining it.</p>\n<h3>Why linking errors are downstream of Ch.1's segmental patterns</h3>\n<p>Linking (Part II Ch.8) depends on a word-final consonant being available to carry forward into the next word's vowel. If that final consonant has already been deleted or altered by epenthesis (Ch.1 of this Part), there is nothing left to link — the error is not really \"a linking mistake\" in isolation; it is Ch.1's segmental pattern breaking a downstream mechanism. This chapter treats linking errors as this specific interaction, not as an unrelated third phenomenon.</p>\n<h3>Mistake 1 — Word-by-word pausing instead of linking</h3>\n<p>Research on Chinese-background ESL learners' production of English connected speech processes documents systematic difficulty achieving native-like linking and connected-speech patterns, consistent with a broader tendency to produce words as more separated units rather than a continuous stream <span class=\"tag tag-practice\">Practice</span>. This connects directly to the syllable-timed rhythm pattern documented in Ch.3 of this Part: if each word is produced as a similarly weighted, separated unit, the natural pressure to link across word boundaries (which arises from rhythmic compression, Part II Ch.5–6) is reduced.</p>\n<h3>Mistake 2 — Missing consonant-to-vowel linking due to final-consonant deletion</h3>\n<p>Where Ch.1's Mistake 3 (final consonant deletion) applies, linking cannot occur at all — there is no consonant left to carry forward. For example, if <em>\"turn it off\"</em> is produced with the final consonants of <em>turn</em> and <em>it</em> already dropped or vowel-inserted (\"tur-nuh it-uh off\" pattern), the native linked form /tɜːr nɪ tɒf/ (Part II Ch.8) is structurally unreachable, regardless of whether the learner has separately studied linking rules. This is why this chapter is sequenced after Ch.1: linking practice is unlikely to succeed until the underlying final-consonant pattern is addressed.</p>\n<h3>Mistake 3 — Missing vowel-to-vowel glide insertion</h3>\n<p>Independent of Mistakes 1–2, some learners do not insert the intrusive /j/ or /w/ glide at vowel-to-vowel word boundaries (Part II Ch.8), instead producing a glottal stop or a brief silence between the two vowels (e.g. <em>\"go on\"</em> produced as /ɡoʊ ʔɒn/ rather than /ɡoʊ wɒn/) <span class=\"tag tag-practice\">Practice</span>. This is a more independent pattern than Mistakes 1–2, since it is not caused by a missing consonant, but by not yet having acquired the specific glide-insertion rule.</p>\n<h2>Examples</h2>\n<table>\n<thead>\n<tr>\n<th>Phrase</th>\n<th>Native linked form</th>\n<th>Common Mandarin/Chinese-L1 pattern</th>\n<th>Mistake #</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>turn it off</td>\n<td>/tɜːr nɪ tɒf/</td>\n<td>\"tur(n) it (o)ff\" — word-separated, final consonants unstable</td>\n<td>1, 2</td>\n</tr>\n<tr>\n<td>an apple</td>\n<td>/ə ˈnæpəl/</td>\n<td>\"a(n) apple\" — no consonant carried forward</td>\n<td>2</td>\n</tr>\n<tr>\n<td>go on</td>\n<td>/ɡoʊ wɒn/</td>\n<td>/ɡoʊ ʔɒn/ — glottal break instead of glide</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Address Ch.1's final-consonant patterns before drilling linking in isolation — this chapter's Mistake 2 shows that linking practice without that foundation has a low ceiling.</li>\n<li>During preparation time for Read Aloud/Repeat Sentence, mark likely linking points (consonant-final word before vowel-initial word) and rehearse the linked form directly, rather than relying on it to happen automatically.</li>\n<li>For Listening and Repeat Sentence input, expect native audio to use these linked forms as the default (Part II Ch.6) — do not mistake a linked phrase for an unfamiliar word or missing content.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Take the three example phrases above and record yourself producing them. Identify which mistake (1, 2, or 3) is present, if any.</li>\n<li>Choose five phrases from your own Read Aloud practice material with a consonant-final word followed by a vowel-initial word. Practice the linked form explicitly, checking that the final consonant is not deleted first.</li>\n<li>Practice the vowel-to-vowel pairs from Part II Ch.8 (<em>\"I am\"</em>, <em>\"go on\"</em>) checking specifically for a glottal stop versus the correct intrusive glide.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Many apparent \"linking mistakes\" are downstream consequences of Ch.1's segmental final-consonant patterns, not an independent error category.</li>\n<li>Mistake 1 (word-by-word pausing) reflects the same syllable-timed tendency documented in Ch.3.</li>\n<li>Mistake 2 (missing consonant-to-vowel linking) occurs specifically when the linking consonant has already been deleted or altered.</li>\n<li>Mistake 3 (missing glide insertion) is a more independent pattern, addressable through direct rule instruction (Part II Ch.8).</li>\n<li>Effective linking correction requires first stabilizing final-consonant production (Ch.1), then applying Part II Ch.8's specific linking rules.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>\"Production of English connected speech processes: an assessment of Cantonese ESL learners' difficulties obtaining native-like speech.\" https://www.academia.edu/109559158/Production_of_English_connected_speech_processes_an_assessment_of_Cantonese_ESL_learners_difficulties_obtaining_native_like_speech — cited as related Chinese-L1 connected-speech evidence.</li>\n<li>Cross-reference: Part II Ch.5 (Sentence Rhythm), Ch.6 (Connected Speech), and Ch.8 (Linking) for the underlying mechanisms; Part IV Ch.1 (segmental errors) and Ch.3 (rhythm errors) for the patterns this chapter's linking errors follow from.</li>\n</ol>"},{"id":"part4-05_top-vowel-mistakes","title":"5. Top Vowel Mistakes（元音高频错误）","meta":{"part":"Part IV — Chinese Error Corpus","status":"Draft","accent":"General American (GA), consistent with Part II"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>Explain why Mandarin's vowel system predicts specific tense/lax neutralization errors, using acoustic research findings.</li>\n<li>Explain why Mandarin's shorter diphthongs predict a monophthongization pattern in English diphthongs.</li>\n<li>Distinguish a duration-only error from a spectral (vowel-quality) error, and why both must be corrected together.</li>\n<li>Apply targeted minimal-pair and diphthong-length drills to each documented pattern.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses vowel terminology defined in Part II Ch.3 (Vowels) — monophthong, diphthong, tense/lax vowel, vowel length — rather than redefining it. New term specific to this chapter:</p>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Spectral Difference</td>\n<td>频谱差异（元音音质差异）</td>\n<td>The difference in vowel quality (tongue/lip position, measured via formant frequencies) between two vowels, as distinct from their duration.</td>\n</tr>\n<tr>\n<td>Monophthongization</td>\n<td>单元音化</td>\n<td>Producing a diphthong as if it were a single, steady vowel, losing its glide.</td>\n</tr>\n</tbody>\n</table>\n<h3>Mistake 1 — Tense/lax neutralization (e.g. /iː/–/ɪ/, \"sheep\"/\"ship\")</h3>\n<p>Mandarin has the tense vowel /i/ but not the lax vowel /ɪ/ as a separate phoneme category <span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.3). Acoustic research directly comparing Mandarin Chinese learners' production of English tense/lax vowel pairs to native speakers found that learners \"overemphasized durational differences and weakened spectral differences\" for the /iː/–/ɪ/ contrast <span class=\"tag tag-linguistics\">Linguistics</span> — in other words, Mandarin L1 speakers tend to distinguish this pair mainly by making one vowel longer and the other shorter, while under-differentiating the actual vowel quality (tongue position) difference that English speakers rely on more heavily. The same research notes that Mandarin L1 speakers tend to set their perceptual boundary for /ɪ/ differently from native English speakers, consistent with treating it as a shortened version of /i/ rather than a distinct vowel quality <span class=\"tag tag-linguistics\">Linguistics</span>.</p>\n<ul>\n<li><strong>Risk level</strong>: Content risk — <em>sheep/ship</em>, <em>seat/sit</em>, and similar pairs are different real words (Part II Ch.3).</li>\n<li><strong>Correction target</strong>: this is a two-part fix, not one — both the duration difference (already often present) and the spectral/quality difference (often missing) need to be produced together, per the research finding above.</li>\n</ul>\n<h3>Mistake 2 — Diphthong monophthongization (shortened, glide-less diphthongs)</h3>\n<p>Because Mandarin's diphthongs tend to be shorter in duration than English diphthongs, Mandarin L1 speakers tend to produce English diphthongs with a shortened duration as well, which can make them sound like monophthongs (single steady vowels) rather than the two-target glide that defines an English diphthong <span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.3). The same research notes that mispronunciation of the monophthongs /ɑ/ and /ɪ/ (Mistake 1's pattern, extended to /ɑ/) can compound this, since it affects the start and end points of diphthongs built from those vowels, such as /aɪ/ <span class=\"tag tag-linguistics\">Linguistics</span>.</p>\n<ul>\n<li><strong>Risk level</strong>: Content risk for pairs distinguished by a diphthong vs monophthong (e.g. <em>by/bah</em>-type contrasts) and Pronunciation-band risk generally, since a collapsed diphthong is a clearly non-native-like realization.</li>\n<li><strong>Correction target</strong>: deliberately lengthening and exaggerating the glide from the diphthong's starting vowel quality to its ending vowel quality, rather than producing a single steady target.</li>\n</ul>\n<h3>Mistake 3 — Broader tense/lax pattern beyond /iː/–/ɪ/</h3>\n<p>The tense/lax mechanism documented in Mistake 1 is not limited to one vowel pair — English's broader tense/lax system (Part II Ch.3: /uː/–/ʊ/, /ɑː/–/ʌ/, and others) rests on a spectral-plus-duration contrast that Mandarin's vowel system does not organize the same way <span class=\"tag tag-linguistics\">Linguistics</span>. This chapter treats /iː/–/ɪ/ as the best-documented case in the available research, and extends the same mechanism, cautiously, to the other tense/lax pairs introduced in Part II Ch.3 <span class=\"tag tag-hypothesis\">Hypothesis</span> — direct acoustic research on each additional pair was not located during this session's research and should be added during the Stage 7 verification pass.</p>\n<h2>Examples</h2>\n<table>\n<thead>\n<tr>\n<th>Minimal/near-minimal pair</th>\n<th>Contrast</th>\n<th>Documented mechanism</th>\n<th>Mistake #</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>sheep / ship</td>\n<td>/iː/ vs /ɪ/</td>\n<td>Weakened spectral difference, overemphasized duration</td>\n<td>1</td>\n</tr>\n<tr>\n<td>fool / full</td>\n<td>/uː/ vs /ʊ/</td>\n<td>Same mechanism extended by analogy</td>\n<td>3</td>\n</tr>\n<tr>\n<td><em>\"by\"</em> /baɪ/ produced closer to /bɑː/</td>\n<td>/aɪ/ diphthong vs monophthong</td>\n<td>Shortened diphthong duration → glide loss</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Treat tense/lax pairs as requiring two-part correction (length AND quality) rather than assuming length alone is sufficient — Mistake 1's research finding shows length-only correction is the more common (and insufficient) learner default.</li>\n<li>For any word containing a diphthong in your PTE vocabulary (Part III), practice the full glide explicitly, checking against the diphthong's two endpoint vowel qualities (Part II Ch.3) rather than producing a single held vowel.</li>\n<li>Prioritize /iː/–/ɪ/ specifically, since it is the most directly research-documented pair and recurs extremely frequently in English vocabulary.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Record the <em>sheep/ship</em> pair. Check both duration (is one clearly shorter?) and quality (do they sound like genuinely different vowels, or the same vowel at different lengths?).</li>\n<li>Take three PTE-relevant words containing a diphthong (e.g. from the /aɪ/, /eɪ/, or /oʊ/ set in Part II Ch.3) and practice exaggerating the glide between the diphthong's two target vowel qualities.</li>\n<li>Extend the /iː/–/ɪ/ drill to one additional tense/lax pair (e.g. /uː/–/ʊ/ with <em>fool/full</em>), applying the same two-part (length + quality) correction target from Mistake 1.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Mandarin lacks /ɪ/ as a distinct phoneme from /i/, predicting a documented tense/lax neutralization pattern for /iː/–/ɪ/, where learners over-rely on duration and under-produce the quality contrast <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li>Mandarin's shorter diphthongs predict monophthongization of English diphthongs — a shortened glide that can sound like a single steady vowel <span class=\"tag tag-linguistics\">Linguistics</span>.</li>\n<li>The tense/lax mechanism is extended cautiously, as a <span class=\"tag tag-hypothesis\">Hypothesis</span>, to other tense/lax pairs beyond the directly-researched /iː/–/ɪ/ case.</li>\n<li>Correction for tense/lax pairs must address both duration and vowel quality together, not duration alone.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Feng, H., &amp; Wang, L. (2024). \"Acoustic analysis of English tense and lax vowels: Comparing the production between Mandarin Chinese learners and native English speakers.\" <em>The Journal of the Acoustical Society of America</em>, 155(5). https://pubs.aip.org/asa/jasa/article/155/5/3071/3290637/Acoustic-analysis-of-English-tense-and-lax-vowels</li>\n<li>\"Comparison Between English and Mandarin Vowel Systems and the Challenges for Chinese Learners of English.\" https://www.researchgate.net/publication/382813064_Comparison_Between_English_and_Mandarin_Vowel_Systems_and_the_Challenges_for_Chinese_Learners_of_English</li>\n<li>\"Pronunciation Problems of Chinese Learners of English.\" https://files.eric.ed.gov/fulltext/EJ1152473.pdf</li>\n<li>Cross-reference: Part II Ch.3 (Vowels) for the underlying GA vowel inventory and tense/lax framework this chapter builds on.</li>\n</ol>"}]},"part5":{"label":"Part V · 题型策略","chapters":[{"id":"part5-01_read-aloud","title":"1. Read Aloud（朗读）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Read Aloud's format and the three enabling skills it is scored on, building directly on Part I Ch.1.</li>\n<li>Use the preparation window to scan a passage for the specific high-risk patterns documented in Part IV.</li>\n<li>Apply Part II's reduction, linking, and stress mechanisms while reading, rather than reading word-by-word.</li>\n<li>Recover from a mid-passage error without restarting, per Part I Ch.1's fluency-weighting finding.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Preview</td>\n<td>预览</td>\n<td>Silently scanning the passage during preparation time before reading aloud.</td>\n</tr>\n<tr>\n<td>Chunking</td>\n<td>分块／意群划分</td>\n<td>Grouping words into meaning units before speaking (Part II Ch.5).</td>\n</tr>\n<tr>\n<td>High-Risk Word</td>\n<td>高风险词</td>\n<td>A word likely to trigger one of the documented error patterns from Part IV.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Read Aloud presents a written passage, commonly reported at around 60–80 words, with a preparation window (commonly reported around 35 seconds, scaling somewhat with passage length) before the microphone opens for a single response window (commonly reported around 30–40 seconds) <span class=\"tag tag-practice\">Practice</span> — these figures come from secondary test-prep sources rather than a directly-fetched primary Pearson document (see Part I's sourcing note) and should be re-verified against the current official test format before publication. Scoring follows the model established in Part I Ch.1: Content (exact-text word-matching), Oral Fluency, and Pronunciation, with Oral Fluency and Pronunciation combined typically outweighing Content <span class=\"tag tag-practice\">Practice</span>.</p>\n<h3>The preparation window is a scanning tool, not a memorization task</h3>\n<p>Given that outweighing (Part I Ch.1) and the specific error patterns documented in Part IV, the highest-value use of preparation time is not attempting to memorize the passage, but scanning it for a short, specific checklist:</p>\n<ol>\n<li><strong>Chunk boundaries</strong> (Part II Ch.5): where do the natural meaning-group breaks fall?</li>\n<li><strong>High-risk phonemes</strong> (Part IV Ch.1): does the passage contain /θ/, /ð/, /v/, or words with final consonants/clusters?</li>\n<li><strong>Stress-risk words</strong> (Part IV Ch.2): are there multisyllabic words or noun/verb stress pairs (e.g. <em>record</em>, <em>present</em>) whose stress you should confirm before speaking?</li>\n<li><strong>Linking points</strong> (Part II Ch.8): where does a consonant-final word meet a vowel-initial word?</li>\n</ol>\n<p>This checklist converts a generic \"prepare the passage\" instruction into the same mechanism-based practice this book has built toward since Part I.</p>\n<h3>Reading with reduction, linking, and stress — not word-by-word</h3>\n<p>Applying Part II Ch.5–8 directly: content words should carry clear stress and full vowel quality; function words should reduce to their weak forms (Ch.7); word boundaries identified in the checklist above should link (Ch.8) rather than pause. A passage read with each word given equal, separated weight will sound closer to Part I Ch.3's Band 1–2 descriptors than Band 4–5, even if every word is technically pronounced \"correctly\" in isolation — because Oral Fluency measures the <em>pattern</em> of delivery, not just individual-word accuracy.</p>\n<h3>Handling an error without restarting</h3>\n<p>Part I Ch.1 already established the core rule: a restart introduces a fluency disruption (repetition/false start) on top of whatever the original error cost. For Read Aloud specifically, this means: if you misread a word, keep going. Do not stop, and do not repeat the sentence or phrase to \"fix\" it.</p>\n<h2>Examples</h2>\n<p>Sample passage excerpt: <em>\"The research team analyzed data from over three thousand participants to determine the long-term effects of the treatment.\"</em></p>\n<p>Preview checklist applied:\n- Chunk boundaries: <em>\"The research team\"</em> / <em>\"analyzed data from over three thousand participants\"</em> / <em>\"to determine the long-term effects of the treatment\"</em>\n- High-risk phonemes: <em>\"three\"</em> (/θ/), <em>\"thousand\"</em> (/θ/), <em>\"effects\"</em> (final consonant cluster /kts/)\n- Stress-risk: <em>\"research\"</em> (noun/verb stress pair — as a noun here, primary stress on the first syllable in GA), <em>\"determine\"</em> (stress on the second syllable)\n- Linking points: <em>\"team analyzed\"</em>, <em>\"data from\"</em>, <em>\"over three\"</em>, <em>\"effects of\"</em></p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Run the four-item checklist above during preparation time as a matter of habit — this converts unstructured \"reading practice\" into a checklist matched directly to what is actually scored (Part I Ch.1).</li>\n<li>Prioritize maintaining chunked, linked delivery over pausing to get an individual difficult word exactly right — the fluency cost of stopping usually exceeds the content cost of one imperfect word.</li>\n<li>After each practice attempt, check your recording specifically against the four checklist items, not just \"did it sound okay.\"</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Take a Read Aloud practice passage and apply the four-item checklist in writing before recording yourself.</li>\n<li>Record the same passage twice: once reading each word with equal separation, once applying chunking, reduction, and linking. Compare both against Part I Ch.3's Band descriptors.</li>\n<li>Deliberately misread one word in a practice passage and continue to the end without stopping. Notice how this differs from your instinct to restart.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Read Aloud scoring follows the Part I Ch.1 model: Content via exact-text matching, weighted alongside Oral Fluency and Pronunciation, which together typically carry more weight.</li>\n<li>Preparation time is best used as a structured scan for chunk boundaries, high-risk phonemes, stress-risk words, and linking points — not memorization.</li>\n<li>Applying Part II's reduction, linking, and stress mechanisms during reading is what separates Band 4–5 delivery from technically-correct-but-choppy delivery.</li>\n<li>Never restart after an error; continuing avoids stacking a fluency disruption on top of the original mistake.</li>\n</ul>\n<h2>References</h2>\n<p>See Part I Ch.1 and Ch.3 References for the primary scoring-mechanism sourcing. Format timing figures (passage length, preparation/response windows) in this chapter:\n1. Gradding. \"Read Aloud PTE: Practice Sample Questions with Expert Tips.\" https://www.gradding.com/blog/pte/read-aloud\n2. AlfaPTE. \"Guide for the Preparation of Read Aloud.\" https://alfapte.com/read-post/preparation-of-read-aloud-pte-examination\n3. AlfaPTE. \"PTE Academic Format 2026.\" https://ptenepal.com/blog/pte-academic-2026-task-list-complete-format-guide/ — secondary-sourced timing figures; re-verify against the primary Pearson test format page before publication.</p>"},{"id":"part5-02_repeat-sentence","title":"2. Repeat Sentence（复述句子）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Repeat Sentence's format and partial-credit Content scoring model.</li>\n<li>Explain why this item tests connected-speech decoding (Part II Ch.6), not just memory.</li>\n<li>Apply chunked listening instead of word-for-word memorization for longer sentences.</li>\n<li>Reproduce a heard sentence using natural connected speech rather than a robotic word-by-word rendition.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Partial Credit</td>\n<td>部分给分</td>\n<td>A scoring model where a response can earn some points without being fully correct.</td>\n</tr>\n<tr>\n<td>Chunked Listening</td>\n<td>分块听力</td>\n<td>Processing incoming speech in meaning groups rather than word-by-word.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Repeat Sentence plays a short audio sentence, commonly reported at roughly 3–9 seconds, after a brief (commonly reported ~3 second) preparation window, with a further response window (commonly reported around 15 seconds) to repeat it <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify against primary format before publication). Content scoring uses partial credit rather than an all-or-nothing model: reproducing the full sentence earns full Content credit, a roughly half-correct reproduction earns partial credit, and a largely incorrect or missing response earns minimal credit <span class=\"tag tag-practice\">Practice</span>. Pronunciation and Oral Fluency are scored using the same band-descriptor model introduced in Part I Ch.1.</p>\n<h3>Why this item is a listening-decoding test, not just a memory test</h3>\n<p>Repeat Sentence audio is typically produced as natural connected speech, not slow, isolated word-by-word citation-form speech <span class=\"tag tag-pearson\">Pearson</span>/<span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.6). This means the sentence you hear may already contain reduced function words (Part II Ch.7), linked word boundaries (Ch.8), and assimilated or elided sounds (Ch.6). A learner who has only practiced recognizing careful, citation-form English may perceive the compressed audio as unfamiliar or may mishear individual words — this is a decoding failure, not a memory failure, and it is exactly the risk Part II Ch.6 flagged when it said connected speech is \"not only a speaking concern.\"</p>\n<h3>Chunked listening instead of word-for-word memorization</h3>\n<p>For short sentences, word-for-word memorization may be feasible. For longer sentences, attempting to hold every individual word in memory is less reliable than processing the sentence the way native listeners do: in meaning chunks (Part II Ch.5), then reconstructing the sentence from those chunks rather than from a word list. This also naturally supports better Oral Fluency, since chunk-based reproduction tends to preserve natural phrasing rather than producing a hesitant, word-by-word recitation.</p>\n<h3>Reproduce with natural delivery, not robotic word-by-word repetition</h3>\n<p>Because Content is scored on whether the correct words were produced (Part I Ch.1), and Oral Fluency/Pronunciation are scored on delivery quality independently, there is no scoring benefit to reproducing the sentence in an unnaturally slow, separated way \"to be safe.\" Applying Part II's reduction and linking to your reproduction (as long as the correct words are present) supports Content, Oral Fluency, and Pronunciation simultaneously — this is the same principle established in Part V Ch.1 for Read Aloud, applied here to reconstructed rather than read text.</p>\n<h2>Examples</h2>\n<p>Heard audio (natural connected speech): <em>\"I don't know when they're going to announce the results.\"</em> — likely realized close to /aɪ doʊnə noʊ wen ðɛr ɡoʊɪŋ tə əˈnaʊns ðə rɪˈzʌlts/ in natural speech (reduced <em>don't know</em>, weak <em>to</em>, linking throughout).</p>\n<p>A learner trained only on careful citation-form audio may mishear <em>\"I don't know\"</em> as an unfamiliar sound string. A learner who has studied Part II Ch.6–8 recognizes this as the expected connected-speech realization of a sentence they already know at the word level.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Train your listening on natural-speed, connected-speech audio specifically for this item type, not only on slow, careful audio — the exam will not present the compressed forms as an exception.</li>\n<li>For sentences beyond about 6–8 words, consciously chunk what you hear into 2–3 meaning groups rather than trying to hold every word individually.</li>\n<li>Reproduce using your own natural weak forms and linking (Part II Ch.7–8) rather than an artificially careful, separated delivery — this supports Oral Fluency and Pronunciation without costing Content.</li>\n<li>If you miss a word or two, still attempt the full sentence structure — partial credit rewards a largely-correct reconstruction over silence or an incomplete fragment.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Listen to five natural-speed sentences (not slowed-down audio) and write down which words you initially misheard, then check whether they correspond to a reduction or linking pattern from Part II.</li>\n<li>Practice chunked reconstruction: listen to an 8–10 word sentence once, and reproduce it by first recalling its 2–3 meaning chunks, then filling in each chunk's exact words.</li>\n<li>Record yourself reproducing a sentence twice: once word-by-word and separated, once with natural reduction and linking. Compare both for Oral Fluency using Part I Ch.3's Band descriptors.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Repeat Sentence uses partial-credit Content scoring alongside the same Oral Fluency/Pronunciation model from Part I Ch.1.</li>\n<li>The audio uses natural connected speech, making this fundamentally a decoding test of Part II Ch.6's material, not only a memory test.</li>\n<li>Chunked listening is more reliable than word-for-word memorization for longer sentences.</li>\n<li>Reproducing with natural reduction and linking supports all three scored skills at once — there is no benefit to an artificially careful, separated delivery.</li>\n</ul>\n<h2>References</h2>\n<p>See Part I Ch.1 and Part II Ch.6–8 References for the primary scoring and connected-speech mechanism sourcing. Format timing figures in this chapter:\n1. Gurully. \"PTE Repeat Sentence Tips, Template and 50+ Sample Questions to Score High in 2026.\" https://www.gurully.com/blog/crack-the-pte-repeat-sentence-task-essential-strategies-for-success/\n2. onePTE. \"PTE Repeat Sentence (RS): A Complete Guide to Get a High Score.\" https://onepte.com/blog/pte-repeat-sentence-guide — secondary-sourced timing and partial-credit figures; re-verify against the primary Pearson test format page before publication.</p>"},{"id":"part5-03_describe-image","title":"3. Describe Image（看图说话）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Describe Image's format and its key-point-based Content mechanism, extending Part I Ch.4.</li>\n<li>Explain why generic memorized templates carry documented risk under current scoring practices.</li>\n<li>Use preparation time to maximize distinct relevant key points rather than elaborating narrowly.</li>\n<li>Apply Part II's rhythm and reduction tools to a spontaneous (non-scripted) response.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses \"key-point matching\" from Part I Ch.4 rather than redefining it.</p>\n<h3>Format and scoring recap</h3>\n<p>Describe Image shows an image (chart, graph, map, diagram, or picture) with a preparation window (commonly reported around 25 seconds) followed by a response window (commonly reported around 40 seconds) <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication). Content, Oral Fluency, and Pronunciation are scored using the models established in Part I Ch.1 and Ch.4; Content specifically uses the key-point/relevance matching mechanism (Part I Ch.4) rather than exact-text matching, since there is no single fixed script for describing an image.</p>\n<h3>A documented shift toward combined AI and human content review</h3>\n<p>Multiple test-prep sources report that Pearson has moved Describe Image (and Retell Lecture, Part V Ch.4) toward a combined AI-and-human review process for Content specifically, intended to better evaluate genuine communication of information and to flag generic, templated, or clearly pre-prepared responses <span class=\"tag tag-practice\">Practice</span> — this is reported via secondary test-prep sources rather than a directly-fetched primary Pearson document, and should be re-verified before publication. If accurate, this has a direct strategic implication: a response that closely follows a memorized, generic template (rather than genuinely describing the specific image shown) carries a documented risk of being flagged and scored down on Content, independent of how fluent or well-pronounced the delivery is.</p>\n<h3>Using preparation time for key-point breadth</h3>\n<p>Building directly on Part I Ch.4's finding for open-response items: within a 40-second response window, stating several distinct, genuinely relevant facts about the image typically covers more scoring ground under a key-point mechanism than elaborating at length on a single feature. Preparation time is best spent identifying 4–6 distinct, specific observations (a trend, a highest/lowest value, a notable comparison, a label or category, a general purpose) rather than planning one polished sentence.</p>\n<h2>Examples</h2>\n<p>For a bar chart showing quarterly sales: an effective preparation-time list might include (1) overall trend across quarters, (2) the highest quarter and its approximate value, (3) the lowest quarter, (4) the size of the gap between highest and lowest, (5) any notable single-quarter change. A response addressing four or five of these points, even briefly, is likely to cover more of the expected key-point set than a longer, single-point elaboration — consistent with Part I Ch.4's Describe Image example.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Avoid rehearsing and reusing a fixed generic template across different images — describe the specific data or content actually shown, given the documented risk of templated-response detection.</li>\n<li>Use preparation time to list distinct observations, not to draft a polished single narrative.</li>\n<li>Apply Part II's content-word prominence and function-word reduction (Ch.5, Ch.7) even in spontaneous, unscripted speech — these mechanisms are not specific to read-aloud text.</li>\n<li>If you run out of new points before the response window ends, briefly restate the overall trend rather than going silent — a coherent close is preferable to an abrupt stop.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Practice with three different image types (bar chart, line graph, process diagram) and generate a 4–6 point preparation list for each within 25 seconds.</li>\n<li>Record a Describe Image response and check afterward whether it followed a generic structure you could have used for a different image, or whether it was specific to the image shown.</li>\n<li>Apply Part II Ch.5's content-word/function-word distinction to a recorded spontaneous response, checking for natural rhythm despite the lack of a fixed script.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Describe Image uses key-point/relevance Content scoring (Part I Ch.4), not exact-text matching.</li>\n<li>Reported scoring practice has moved toward combined AI-and-human Content review that can flag generic templated responses — a specific, documented risk to relying on memorized templates <span class=\"tag tag-practice\">Practice</span>.</li>\n<li>Preparation time is most effective when used to list distinct relevant observations rather than to draft one elaborated point.</li>\n<li>Part II's rhythm and reduction mechanisms apply to spontaneous speech exactly as they do to read text.</li>\n</ul>\n<h2>References</h2>\n<p>See Part I Ch.1 and Ch.4 References for the primary scoring-mechanism sourcing. Format and scoring-practice sources specific to this chapter:\n1. PTE Panacea. \"PTE Scoring Changes 2024: Describe Image &amp; Retell Lecture.\" https://ptepanacea.com/blog/detail/new-pte-academic-scoring\n2. LearnPTE. \"PTE Describe Image: Complete Guide with Templates &amp; Examples.\" https://www.learnpte.com/blogs/guides/mastering-pte-describe-image-task\n3. DreamEnglish. \"PTE Describe Image: Complete Guide to Scoring High.\" https://dreamenglish.com.au/pte-describe-image-2025-scoring-high/ — secondary-sourced timing and scoring-practice figures; re-verify against the primary Pearson test format page before publication.</p>"},{"id":"part5-04_retell-lecture","title":"4. Retell Lecture（复述讲座）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Retell Lecture's format and its key-point Content mechanism, distinguishing it from Repeat Sentence's exact-match mechanism.</li>\n<li>Apply note-taking during the lecture audio as a preparation strategy distinct from Describe Image's static preparation time.</li>\n<li>Explain why this item shares Describe Image's documented shift toward combined AI-and-human Content review.</li>\n<li>Structure a retell response that prioritizes key points over verbatim reproduction.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<p>This chapter reuses \"key-point matching\" (Part I Ch.4) and the AI-and-human content review note (Part V Ch.3) rather than redefining them.</p>\n<h3>Format and scoring recap</h3>\n<p>Retell Lecture plays an audio (sometimes video) lecture, commonly reported as up to about 90 seconds, followed by a preparation window (commonly reported around 10 seconds) and a response window (commonly reported around 40 seconds) <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication). Content, Oral Fluency, and Pronunciation are scored using the models from Part I Ch.1; Content uses key-point/relevance matching (Part I Ch.4), the same mechanism as Describe Image (Part V Ch.3), not the exact-text matching used by Read Aloud and Repeat Sentence.</p>\n<h3>Retell Lecture is not Repeat Sentence at a larger scale</h3>\n<p>A common learner error is treating Retell Lecture as \"Repeat Sentence but longer\" — attempting to reproduce the lecture close to verbatim. This misapplies the wrong content mechanism: Part I Ch.4 established that key-point items are scored on relevant idea coverage, not word-for-word matching. A response that captures the lecture's main claim and 2–4 supporting points in the speaker's own words is aligned with how this item is actually scored; a response that tries to reproduce exact phrasing from a 90-second audio source (much longer than Repeat Sentence's few-second prompts) is attempting a much harder and less rewarded task.</p>\n<h3>Note-taking during the lecture</h3>\n<p>Unlike Describe Image, where preparation time begins after the prompt is fully visible, Retell Lecture's primary preparation opportunity is <em>during</em> the lecture audio itself — the response-planning preparation window afterward is comparatively short (commonly reported around 10 seconds). This makes note-taking while listening the primary preparation tool for this item, distinct from every other speaking item in this Part. Effective notes capture key nouns, numbers, and the overall structure (e.g. problem → cause → solution) rather than attempting a full transcript, which is not achievable in real time and is not what the key-point mechanism rewards.</p>\n<h3>Shared scoring-practice note with Describe Image</h3>\n<p>As with Describe Image (Part V Ch.3), test-prep sources report Retell Lecture's Content has moved toward combined AI-and-human review intended to evaluate genuine information communication <span class=\"tag tag-practice\">Practice</span> — the same documented risk applies here: a response built from a generic, content-independent template (rather than the specific lecture's actual points) carries a reported risk of being scored down, regardless of fluency or pronunciation quality.</p>\n<h2>Examples</h2>\n<p>For a 90-second lecture on renewable energy adoption barriers: effective notes might capture \"barriers: cost, infrastructure, policy — cost falling, infrastructure lagging in rural areas — policy varies by country.\" A 40-second retell built from these notes, restructured in the speaker's own words with natural chunking and reduction (Part II Ch.5, Ch.7), covers the expected key points without attempting verbatim reproduction of the original audio.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Take notes during the lecture audio itself — this is the primary preparation opportunity for this item, unlike the other speaking items in this Part.</li>\n<li>Structure your retell around key points and their relationships (cause/effect, comparison, sequence), not verbatim phrasing from the audio.</li>\n<li>Avoid a fixed generic retell template independent of the lecture's actual content, given the same documented AI-and-human review risk noted for Describe Image.</li>\n<li>If the lecture covered more points than you can retell in 40 seconds, prioritize breadth across distinct points over full elaboration of the first one or two you recall, consistent with Part I Ch.4's open-response strategy.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Listen to a 60–90 second lecture-style recording and take notes using only key nouns, numbers, and structural markers (not full sentences). Retell it from those notes.</li>\n<li>Compare a verbatim-attempt retell against a key-point-based retell of the same lecture. Which better matches the key-point mechanism from Part I Ch.4?</li>\n<li>Practice restructuring a lecture's content into your own words in real time, rather than searching for the exact phrasing you heard.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Retell Lecture uses key-point/relevance Content scoring (Part I Ch.4), the same mechanism as Describe Image, not exact-text matching.</li>\n<li>It should not be treated as \"Repeat Sentence at scale\" — verbatim reproduction is neither achievable nor rewarded.</li>\n<li>Note-taking during the lecture audio itself is the primary preparation tool, distinct from the other speaking items in this Part.</li>\n<li>The same documented AI-and-human Content review risk for generic templates applies here as in Describe Image.</li>\n</ul>\n<h2>References</h2>\n<p>See Part I Ch.1 and Ch.4 References for the primary scoring-mechanism sourcing, and Part V Ch.3 References for the shared AI-and-human review note. Format sources specific to this chapter:\n1. Gurully. \"Best PTE Retell Lecture Template &amp; Tips.\" https://www.gurully.com/blog/pte-re-tell-lecture-template/\n2. speakshark. \"PTE Speaking Retell Lecture 2026: Notes and Template.\" https://speakshark.com/blog/pte-speaking-retell-lecture — secondary-sourced timing figures; re-verify against the primary Pearson test format page before publication.</p>"},{"id":"part5-05_respond-to-situation","title":"5. Respond to a Situation（情景应答）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Respond to a Situation's format and its appropriateness-based Content mechanism — a third mechanism alongside the two established in Part I Ch.4.</li>\n<li>Explain why this item, introduced in the August 2025 format update, tests spontaneous pragmatic competence rather than scripted or memorized content.</li>\n<li>Structure a natural, situationally appropriate response within the item's short planning window.</li>\n<li>Apply the same Oral Fluency and Pronunciation priorities established in Part I to unscripted, socially-framed speech.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Appropriateness</td>\n<td>得体性／恰当性</td>\n<td>Whether a response fits the social/functional demands of the situation (e.g. apologizing, declining, requesting), not just whether it is grammatically correct.</td>\n</tr>\n<tr>\n<td>Pragmatic Competence</td>\n<td>语用能力</td>\n<td>The ability to use language appropriately for a given social context and communicative goal.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Respond to a Situation presents a real-life scenario (by audio or on-screen text) and requires a spoken response, with a preparation window (commonly reported around 10 seconds) and a response window (commonly reported around 40 seconds), with responses commonly reported in the 30–40 word range <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication). It was introduced as part of the August 2025 PTE Academic format update (Part I Ch.1). Scoring uses Content, Oral Fluency, and Pronunciation <span class=\"tag tag-pearson\">Pearson</span>/<span class=\"tag tag-practice\">Practice</span>, with Content specifically reported to check whether the response is appropriate for the situation and achieves its communicative goal <span class=\"tag tag-practice\">Practice</span> — as with Describe Image and Retell Lecture, Content review is reported to combine AI and human evaluation.</p>\n<h3>A third Content mechanism: appropriateness matching</h3>\n<p>Part I Ch.4 documented two Content mechanisms: exact-text matching (Read Aloud, Repeat Sentence) and key-point/relevance matching (Describe Image, Retell Lecture). Respond to a Situation's Content mechanism is best understood as a third, related category: <strong>appropriateness matching</strong> — the response is not checked against a fixed script or a fixed set of key points, but against whether it accomplishes the situation's communicative function (e.g. declining an invitation politely, requesting clarification, expressing concern) <span class=\"tag tag-practice\">Practice</span>. This extends, rather than contradicts, Part I Ch.4's framework: it is still a Content mechanism distinct from Oral Fl
