uency and Pronunciation, but its evaluation criterion is functional/social fit rather than word overlap or fact coverage.</p>\n<h3>Why this tests spontaneous competence, not memorized templates</h3>\n<p>Because the scoring criterion is situational appropriateness rather than a fixed script or key-point set, and because Content review is reported to include human evaluation, a generic memorized response prepared in advance for \"any situation\" is unlikely to reliably achieve the specific communicative goal of a given prompt <span class=\"tag tag-hypothesis\">Hypothesis</span> — this is a reasoned extension of the same template-detection risk already documented for Describe Image and Retell Lecture (Part V Ch.3), applied here because this item shares their hybrid review model, though this specific extension to Respond to a Situation has not been independently confirmed in the sources found for this chapter.</p>\n<h2>Examples</h2>\n<p>Prompt (paraphrased): <em>\"Your colleague asks to borrow your notes from an important meeting, but you need them yourself today. Respond to your colleague.\"</em></p>\n<p>An appropriate response acknowledges the request, explains the constraint honestly, and offers an alternative (e.g. sharing them later, or a photocopy) — this accomplishes the situation's communicative goal (declining while maintaining the relationship) rather than simply producing grammatically correct English unrelated to the specific social demand of the prompt.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Use the short preparation window to identify the situation's communicative goal first (What does this situation require — an apology, a request, a decline, reassurance?) before planning specific wording.</li>\n<li>Prioritize a response that clearly accomplishes the situation's function over one that is longer or more elaborate but socially off-target.</li>\n<li>Apply natural rhythm, reduction, and linking (Part II) — this item is spontaneous speech, and the same delivery mechanisms apply as in Describe Image (Part V Ch.3).</li>\n<li>Avoid relying on a single memorized \"safe\" response for all situations, given the appropriateness-based Content mechanism and the reported human-review component.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Practice identifying the communicative goal (apology, request, decline, suggestion, complaint, reassurance) for five different situation prompts before drafting any wording.</li>\n<li>Record a response to a situation prompt and evaluate it against one question: does this response actually accomplish what the situation requires, independent of grammar or pronunciation quality?</li>\n<li>Compare two responses to the same prompt — one generic and templated, one specifically tailored to the prompt's details — and assess which better fits the appropriateness-matching mechanism described in this chapter.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Respond to a Situation, introduced in the August 2025 format update, is scored on Content, Oral Fluency, and Pronunciation, with Content reported to use a combined AI-and-human review <span class=\"tag tag-practice\">Practice</span>.</li>\n<li>Its Content mechanism — appropriateness matching — is a third category alongside Part I Ch.4's exact-text and key-point mechanisms, evaluating situational/functional fit rather than word overlap or fact coverage.</li>\n<li>The short preparation window is best used to identify the situation's communicative goal before planning wording.</li>\n<li>Generic memorized responses are a documented-adjacent risk here, though this specific extension is flagged as a reasoned inference (<span class=\"tag tag-hypothesis\">Hypothesis</span>) rather than a directly confirmed finding.</li>\n</ul>\n<h2>References</h2>\n<p>See Part I Ch.1 and Ch.4 References for the primary scoring-mechanism sourcing, and Part V Ch.3 for the shared AI-and-human review note. Format and item-introduction sources specific to this chapter:\n1. onePTE. \"New format PTE Academic tests\" (August 2025 item-type update). https://onepte.com/blog/new-format-pte-academic-tests-online\n2. Gurully. \"Everything About PTE Academic Respond to a Situation: Tips &amp; Template.\" https://www.gurully.com/blog/pte-academic-respond-to-a-situation/\n3. Sumlingo. \"Respond to Situation in PTE Academic: Format, Scoring &amp; Expert Tips.\" https://sumlingo.com/blog/pte-respond-to-situation/ — secondary-sourced timing and scoring figures; re-verify against the primary Pearson test format page before publication.</p>"},{"id":"part5-06_summarize-written-text","title":"6. Summarize Written Text（总结写作文本）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"Not applicable (writing task; no spoken/pronunciation component)"},"html":"<p><strong>Scope note</strong>: This is a writing item with no speaking or pronunciation component. It is included for the book's completeness (per the original Part V structure covering all PTE item types), but is necessarily lighter-touch than the speaking chapters in this Part, which are this book's core focus. Readers preparing primarily for pronunciation/speaking should treat this chapter as reference material, not a priority.</p>\n<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Summarize Written Text's strict Form requirement and why violating it caps the score regardless of content quality.</li>\n<li>State the five scoring dimensions: Content, Form, Grammar, Vocabulary, Spelling.</li>\n<li>Apply a one-sentence summary structure that satisfies the Form constraint while covering the source text's main idea.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Form (SWT sense)</td>\n<td>格式要求</td>\n<td>The requirement that the response be exactly one grammatically complete sentence within a specified word range.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Summarize Written Text requires a single, complete sentence between roughly 5 and 75 words summarizing a source passage, within a 10-minute time limit; a commonly recommended target length is around 35–55 words <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication). Scoring covers Content (coverage of the main idea and key supporting points), Form, Grammar, Vocabulary, and Spelling <span class=\"tag tag-practice\">Practice</span>.</p>\n<h3>The Form rule is a hard constraint, not a style preference</h3>\n<p>Test-prep sources consistently report that writing two or more sentences — even if each is grammatically correct — scores zero on Form, which directly caps the overall task score regardless of how well Content, Grammar, and Vocabulary are otherwise handled <span class=\"tag tag-practice\">Practice</span>. This is a binary structural rule, not a matter of degree: a response either is one sentence within the word range, or it is not.</p>\n<h3>One-sentence structure</h3>\n<p>A reliable structure for satisfying Form while covering Content is to combine the source's main idea with its most important supporting point(s) using subordination (e.g. relative clauses, participial phrases, or coordinating conjunctions joined within a single sentence) rather than writing separate sentences and hoping to merge them after the fact.</p>\n<h2>Examples</h2>\n<p>Source passage main idea: a study found remote work increases reported employee satisfaction but may reduce cross-team collaboration.</p>\n<p>One-sentence summary: <em>\"A recent study found that while remote work has increased employees' reported satisfaction, it may also be reducing collaboration between different teams, raising questions about how organizations should balance flexibility with cross-team communication.\"</em></p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Draft mentally (or on scratch paper) as a single sentence from the start, rather than writing multiple sentences and attempting to merge them under time pressure.</li>\n<li>Prioritize the source's main idea plus its most significant supporting point; do not attempt to include every detail from the source passage.</li>\n<li>Check word count and sentence count before finalizing — a single grammatical error is recoverable in Grammar scoring, but a Form violation is not.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Take a short article and draft a single-sentence summary within the 35–55 word target range.</li>\n<li>Practice combining two separate ideas into one sentence using subordination, without exceeding a natural sentence structure.</li>\n<li>Review a draft summary and count both words and sentences before considering it final.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Summarize Written Text requires exactly one sentence within roughly 5–75 words; violating this caps the score regardless of content quality.</li>\n<li>Scoring covers Content, Form, Grammar, Vocabulary, and Spelling.</li>\n<li>A reliable strategy is drafting as a single sentence from the start using subordination, not writing multiple sentences and merging them.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>PTE Nepal. \"PTE Writing Word Limits 2026: Essay 200-300 &amp; SWT 5-75.\" https://ptenepal.com/blog/pte-writing-word-limits-penalty/</li>\n<li>Gurully. \"PTE Summarize Written Text 2026: Tips &amp; Tricks To Score High.\" https://www.gurully.com/blog/pte-summarize-written-text-tips-tricks-to-score-high/ — secondary-sourced format and scoring figures; re-verify against the primary Pearson test format page before publication.</li>\n</ol>"},{"id":"part5-07_write-email","title":"7. Write Email（邮件写作，PTE Core专属题型）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"Not applicable (writing task; no spoken/pronunciation component)"},"html":"<p><strong>Scope note — resolved</strong>: Write Email is confirmed <span class=\"tag tag-practice\">Practice</span> (cross-verified across multiple independent secondary sources, see References) to be a <strong>PTE Core–only</strong> item type. It is not part of PTE Academic, which this book is otherwise scoped to. PTE Academic's writing task is Write Essay — a 200–300 word formal argumentative essay, covered in Ch.8 — not Write Email. If you are sitting <strong>PTE Academic</strong>, this chapter does not apply to your test and can be skipped; keep it only if you are separately preparing for <strong>PTE Core</strong>, or if Pearson later unifies the two formats. This chapter is retained as supplementary material precisely because Pearson runs both tests and a reader's actual registration may not match the book's primary PTE Academic scope — but it is not part of the book's core curriculum, unlike every other chapter in this Part.</p>\n<p>This is a writing item with no speaking or pronunciation component in any case, so it is necessarily lighter-touch than the speaking chapters in this Part.</p>\n<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Write Email's reported format, word range, and time limit.</li>\n<li>State the reported scoring dimensions: Content, Form, Tone, Grammar, Vocabulary, Spelling, Organization.</li>\n<li>Apply a structure that covers all required bullet points with appropriate tone and organization.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tone (writing sense)</td>\n<td>语气／正式程度</td>\n<td>The level of formality appropriate to the situation described in the prompt.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Write Email presents a scenario with a small number of required points (commonly reported as three bullet points) that the response must address, within a reported 9-minute time limit and a word range of roughly 50–120 words (a 100-word target commonly recommended) <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication, including the module caution above). Reported scoring dimensions: Content (coverage of all required bullet points — missing even one is reported to significantly reduce the score), Form (email structure: greeting and closing present, appropriate length), Tone (formality matched to the situation), Grammar, Vocabulary, Spelling, and Organization (logical paragraphing) <span class=\"tag tag-practice\">Practice</span>.</p>\n<h3>Covering every required point</h3>\n<p>Because missing even one of the required bullet points is reported to significantly reduce the Content score, the highest-priority strategy is straightforward: identify every required point from the prompt explicitly (e.g. by listing them before drafting) and confirm each appears in the final response, rather than trusting memory or a general sense of having \"covered the topic.\"</p>\n<h3>Matching tone and structure to the scenario</h3>\n<p>An email response is expected to include a greeting and closing appropriate to the scenario's formality level (e.g. a workplace complaint vs a casual request to a friend), and to organize its points into clear paragraphs rather than a single undifferentiated block <span class=\"tag tag-practice\">Practice</span>.</p>\n<h2>Examples</h2>\n<p>Prompt scenario (paraphrased): a customer writing to a company about a delayed order, expected to (1) describe the problem, (2) explain the impact, (3) request a specific resolution.</p>\n<p>An effective structure: greeting → one paragraph describing the delay and its impact → one paragraph requesting a specific resolution → closing. Each of the three required points maps to a specific, identifiable part of the response.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>List the required bullet points explicitly before drafting, and check each is addressed before finalizing.</li>\n<li>Match formality to the scenario — a professional complaint and a casual personal email call for different openings, closings, and vocabulary.</li>\n<li>Organize distinct points into separate paragraphs rather than one continuous block.</li>\n<li>If you are sitting PTE Academic, skip this chapter — it does not appear on your test. Use Ch.8 Essay instead, which covers PTE Academic's actual writing task.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Take an email prompt with three required points and draft a response, then check off each point explicitly against the final draft.</li>\n<li>Draft the same content twice at two different formality levels (formal vs semi-formal) and compare tone markers (greeting, closing, word choice).</li>\n<li>If you are actually preparing for PTE Core, verify your specific test registration confirms Write Email's current format and word range, since Pearson's formats are updated periodically.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Write Email requires covering all required bullet points, matching tone to the scenario, and using clear email structure and organization.</li>\n<li>Missing a required point is reported to carry a significant Content penalty, making explicit point-checking the highest-priority strategy.</li>\n<li><strong>This chapter is PTE Core–only.</strong> PTE Academic test-takers should use Ch.8 Essay instead — this chapter is retained as supplementary material for readers also preparing for PTE Core.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>EasyPTE. \"PTE Core Write Email (WE) in 2025: Format, Scoring, Safe Templates, and Real Teacher Tips!\" https://www.easypte.com/blogs/pte-core-write-email-format-scoring</li>\n<li>PTE Panacea. \"PTE Core Write Email: Format, Tips, Scoring, and Strategies.\" https://ptepanacea.com/blog/detail/pte-core-write-email</li>\n<li>Gurully. \"Difference Between PTE Core Vs PTE Academic: What to Keep in Mind For 2026?\" https://www.gurully.com/blog/pte-academic-vs-pte-core/ — confirms Write Email replaces Write Essay specifically in PTE Core, while PTE Academic retains Write Essay (200–300 words, formal argumentative essay).</li>\n<li>E2Language. \"PTE Updates and Enhancements 2025\" and \"PTE in 2026: What's Changed and New Marking Standard.\" https://blog.e2language.com/ — documents the August 2025 PTE Academic update (added Respond to a Situation and Summarize Group Discussion; updated Write Essay scoring to a 0–6 scale) with no mention of Write Email being added to PTE Academic, corroborating that it remains PTE Core–exclusive. The module-scope question flagged in earlier drafts of this chapter is resolved by sources 3–4 as of this session (2026-08-06); see <code>REFERENCES.md</code>'s Source Log.</li>\n</ol>"},{"id":"part5-08_essay","title":"8. Essay（议论文写作）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"Not applicable (writing task; no spoken/pronunciation component)"},"html":"<p><strong>Scope note</strong>: This is a writing item with no speaking or pronunciation component, included for completeness per the original Part V structure. It is necessarily lighter-touch than the speaking chapters in this Part.</p>\n<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>State Essay's word count, time limit, and reported scoring dimensions.</li>\n<li>Apply a structure that supports content relevance, coherence, and logical argumentation within the time limit.</li>\n<li>Allocate the 20-minute window across planning, writing, and review.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Coherence</td>\n<td>连贯性</td>\n<td>Whether ideas connect logically from sentence to sentence and paragraph to paragraph.</td>\n</tr>\n<tr>\n<td>Essay Structure</td>\n<td>议论文结构</td>\n<td>The organizational pattern (e.g. introduction, body paragraphs, conclusion) expected of a formal argumentative essay.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and scoring recap</h3>\n<p>Essay requires a response of roughly 200–300 words to a given prompt, within a 20-minute window for planning, writing, and review <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication). Reported scoring dimensions: content relevance, coherence, grammar, vocabulary, and essay structure <span class=\"tag tag-practice\">Practice</span>; the task is described as testing the ability to organize ideas, argue logically, and write clearly.</p>\n<h3>Time allocation within the 20-minute window</h3>\n<p>Because the window covers planning, writing, and review together, a deliberate allocation (e.g. roughly 2–3 minutes planning, 13–15 minutes writing, 2–3 minutes review) is more reliable than starting to write immediately without a plan or spending most of the time writing with no review pass — an unreviewed essay risks avoidable grammar and spelling errors that a brief final check would catch.</p>\n<h3>A structure that supports coherence</h3>\n<p>A conventional structure — introduction stating a clear position, 2–3 body paragraphs each developing one supporting point, and a conclusion restating the position — supports the coherence and structure dimensions directly, because it gives each paragraph a single, identifiable function rather than mixing multiple ideas together.</p>\n<h2>Examples</h2>\n<p>Prompt (paraphrased): <em>\"Some people believe technology has made communication less personal. To what extent do you agree?\"</em></p>\n<p>Structure: introduction (state a position — e.g. partial agreement), body paragraph 1 (a way technology has reduced personal connection, with a specific example), body paragraph 2 (a countervailing way technology has enabled personal connection, maintaining the \"partial agreement\" position), conclusion (restate the nuanced position).</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Spend a short, deliberate planning phase identifying your position and 2–3 supporting points before writing, rather than discovering your argument as you write.</li>\n<li>Keep each body paragraph focused on one point to support coherence scoring.</li>\n<li>Reserve time at the end for a review pass focused on grammar and spelling, since these are scored separately from content and structure.</li>\n<li>Stay within the word range — significantly under or over the target range is a structural risk independent of content quality, mirroring the Form-constraint logic in Part V Ch.6.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Practice a full 20-minute essay with explicit time-boxing (planning/writing/review) and note whether you actually completed all three phases.</li>\n<li>Take a completed essay draft and check whether each body paragraph develops exactly one point, or whether points are mixed across paragraphs.</li>\n<li>Review a past essay draft specifically for grammar and spelling only, separate from a content/structure review pass.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>Essay requires roughly 200–300 words within 20 minutes, scored on content relevance, coherence, grammar, vocabulary, and structure.</li>\n<li>Deliberate time allocation across planning, writing, and review is more reliable than writing without a plan or skipping review.</li>\n<li>A conventional introduction/body/conclusion structure, with one point per body paragraph, directly supports the coherence and structure scoring dimensions.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Language Academy. \"PTE Writing Tips 2026: Essay and Summarise Written Text.\" https://www.languageacademy.com.au/blog/pte-writing-tips-2026-essay-and-summarise-written-text-masterclass/</li>\n<li>PTE Nepal. \"PTE Writing Word Limits 2026: Essay 200-300 &amp; SWT 5-75.\" https://ptenepal.com/blog/pte-writing-word-limits-penalty/ — secondary-sourced format and scoring figures; re-verify against the primary Pearson test format page before publication.</li>\n</ol>"},{"id":"part5-09_reading","title":"9. Reading（阅读）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"Not applicable (reading task; no spoken/pronunciation component)"},"html":"<p><strong>Scope note</strong>: This is a receptive reading item set with no speaking or pronunciation component, included for completeness per the original Part V structure. Its main link to this book's core focus is indirect: the vocabulary knowledge built in Part III supports reading comprehension speed and accuracy. This chapter is necessarily lighter-touch than the speaking chapters in this Part.</p>\n<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>List the five PTE Academic Reading item types and their formats.</li>\n<li>State which item types carry partial credit versus all-or-nothing scoring.</li>\n<li>Apply an item-appropriate reading strategy for each type within the section's overall time budget.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Partial Credit (Reading sense)</td>\n<td>部分给分</td>\n<td>Earning some points for partially correct answers, applicable to Fill in the Blanks item types in this section.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and item types</h3>\n<p>The Reading section is commonly reported to last around 29–30 minutes with 13–18 questions across five item types <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication):</p>\n<ol>\n<li><strong>Multiple Choice, Single Answer</strong> — select the one correct option.</li>\n<li><strong>Multiple Choice, Multiple Answers</strong> — select all correct options (no partial credit is typically implied for this type in the sources found; treat with caution pending verification).</li>\n<li><strong>Fill in the Blanks (Dropdown)</strong> — select the best word for each blank from a dropdown list; partial credit, one point per correct blank <span class=\"tag tag-practice\">Practice</span>.</li>\n<li><strong>Fill in the Blanks (Drag and Drop)</strong> — drag words into blanks; also reported with partial, per-blank credit <span class=\"tag tag-practice\">Practice</span>, and is described as testing reading and writing together (grammar, collocation, vocabulary, context).</li>\n<li><strong>Reorder Paragraphs</strong> — arrange scrambled paragraphs into the original logical order, requiring identification of main ideas and logical/cohesive connections between paragraphs.</li>\n</ol>\n<p>Fill in the Blanks (both types combined) is reported to make up the largest share of questions in this section, and to affect both the Reading and Writing communicative scores <span class=\"tag tag-practice\">Practice</span>.</p>\n<h3>Vocabulary knowledge as the main link to this book</h3>\n<p>Because Fill in the Blanks item types test precise word choice in context (collocation, grammar fit, meaning), the vocabulary depth built in Part III (word meaning, related words, common confusions) transfers directly to reading speed and accuracy here — this is the primary reason this chapter exists in a pronunciation-focused book, rather than any pronunciation-specific mechanism.</p>\n<h2>Examples</h2>\n<p>A Reorder Paragraphs task typically rewards identifying a paragraph with a clear topic sentence or introductory marker (a likely first paragraph) and looking for cohesive links — pronouns, transition words (\"however\", \"as a result\"), and topic continuity — between remaining paragraphs, rather than reading and re-reading the full set repeatedly without a structural strategy.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>For Fill in the Blanks items, use collocation and grammar knowledge (Part III's \"Related Words\" and \"Common Mistakes\" fields) to narrow options before final selection.</li>\n<li>For Reorder Paragraphs, identify the likely opening paragraph first, then build outward using cohesion markers rather than attempting a single linear read-through guess.</li>\n<li>For Multiple Choice items, eliminate clearly incorrect options first rather than searching for the correct one directly.</li>\n<li>Manage time across the section deliberately, since it combines both quick-answer items (Multiple Choice) and more time-consuming items (Reorder Paragraphs, longer Fill in the Blanks passages).</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Practice a Reorder Paragraphs set by first identifying the likely opening paragraph, then listing the cohesion markers that link each subsequent paragraph.</li>\n<li>For a Fill in the Blanks (Dropdown) passage, identify which blanks you can resolve confidently via grammar/collocation alone, versus which require full-sentence comprehension.</li>\n<li>Time yourself on a full Reading section practice set and note which item type consumed a disproportionate share of your time.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>The Reading section covers five item types: Multiple Choice (single/multiple answer), Fill in the Blanks (dropdown/drag-and-drop), and Reorder Paragraphs.</li>\n<li>Fill in the Blanks item types are reported to carry partial, per-blank credit and to make up the largest share of the section.</li>\n<li>Part III's vocabulary depth is this chapter's main link to the book's pronunciation focus, supporting Fill in the Blanks accuracy specifically.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Gradding. \"PTE Reading Section Guide 2026: Test Format, Scoring &amp; ...\" https://www.gradding.com/blog/pte/reading-section</li>\n<li>Sumlingo. \"Latest PTE Academic Reading Section with Tips and Scoring Criteria.\" https://sumlingo.com/blog/updated-scoring-criteria-pte-reading-section/ — secondary-sourced format and scoring figures; re-verify against the primary Pearson test format page before publication.</li>\n</ol>"},{"id":"part5-10_listening","title":"10. Listening（听力）","meta":{"part":"Part V — Question Strategy","status":"Draft","accent":"General American (GA), consistent with Parts II and IV — relevant here because the audio you decode uses these same connected-speech patterns"},"html":"<p><strong>Scope note</strong>: This item set has no spoken production component, but unlike the writing/reading chapters in this Part, it connects directly back to this book's pronunciation focus: several item types specifically test whether you can <em>decode</em> the connected-speech phenomena documented in Part II, in reverse — recognition rather than production.</p>\n<h2>Learning Objectives</h2>\n<p>By the end of this chapter, you will be able to:</p>\n<ul>\n<li>List the main PTE Academic Listening item types and their formats.</li>\n<li>Explain why Write from Dictation and Highlight Incorrect Words specifically test connected-speech recognition (Part II Ch.6–9).</li>\n<li>Apply Part II's reduction and linking knowledge in reverse, as a listening-decoding tool.</li>\n<li>Distinguish partial-credit item types from negatively-marked item types in this section.</li>\n</ul>\n<h2>Theory</h2>\n<h3>Key Terms 关键术语</h3>\n<table>\n<thead>\n<tr>\n<th>English</th>\n<th>中文</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Negative Marking</td>\n<td>倒扣分</td>\n<td>Losing a point for an incorrect selection, in addition to not gaining one for a correct selection — applies to some Listening item types.</td>\n</tr>\n<tr>\n<td>Decoding (listening sense)</td>\n<td>听力解码</td>\n<td>Recognizing the intended words behind a compressed, connected-speech audio signal.</td>\n</tr>\n</tbody>\n</table>\n<h3>Format and item types</h3>\n<p>The Listening section is commonly reported to last around 30–43 minutes across roughly eight item types <span class=\"tag tag-practice\">Practice</span> (secondary-sourced; re-verify before publication), including:</p>\n<ul>\n<li><strong>Summarize Spoken Text</strong>: hear a lecture (commonly reported 60–90 seconds), then write a 50–70 word summary within a 10-minute window; scored on content, form, and language quality, contributing to both Listening and Writing <span class=\"tag tag-practice\">Practice</span>.</li>\n<li><strong>Fill in the Blanks</strong>: a transcript with blanks, completed by listening to the audio.</li>\n<li><strong>Highlight Correct Summary</strong>: select the paragraph that best summarizes the audio.</li>\n<li><strong>Highlight Incorrect Words</strong>: read a text while listening to its audio version, which contains altered words; identify each alteration.</li>\n<li><strong>Write from Dictation</strong>: hear a short sentence (commonly reported 3–5 seconds) and type it verbatim.</li>\n<li>Additional reported item types include Multiple Choice (single/multiple answer) and Select Missing Word.</li>\n</ul>\n<p>Scoring varies by item type: some are simple correct/incorrect (one point, no negative marking); Multiple Choice (Multiple Answer) and Highlight Incorrect Words are reported to apply negative marking (a point deducted per incorrect selection, alongside points earned for correct ones) <span class=\"tag tag-practice\">Practice</span>; Summarize Spoken Text uses a more detailed multi-dimension scoring model similar to the writing items in this Part.</p>\n<h3>Why Write from Dictation and Highlight Incorrect Words test Part II directly</h3>\n<p>Both item types require distinguishing the exact words actually spoken from what a listener might otherwise expect or mishear — and spoken PTE audio is not slowed-down, citation-form speech <span class=\"tag tag-pearson\">Pearson</span>/<span class=\"tag tag-linguistics\">Linguistics</span> (Part II Ch.6). A learner who has only trained their ear on careful, separated-word audio is at a specific, documented-mechanism disadvantage here: weak forms (Ch.7), linked word boundaries (Ch.8), and assimilated/elided sounds (Ch.6) are all things Write from Dictation requires you to correctly resolve back into their full written form, and Highlight Incorrect Words requires you to notice precisely where the spoken version diverges from the printed text — which is much harder if you cannot reliably distinguish a genuine word substitution from an expected connected-speech reduction.</p>\n<h3>Applying Part II in reverse</h3>\n<p>Part II's chapters were framed around production (how to speak this way). For Listening, the same knowledge applies in reverse, as a recognition tool: knowing that <em>\"want to\"</em> is expected to reduce to something close to /ˈwɒnə/ (Part II Ch.7) means a learner will not mistake this for an unfamiliar word or a dictation error — they will correctly transcribe it as \"want to.\" This reversal is why this book places its Listening chapter last: it draws on nearly every mechanism introduced earlier in the book, applied to comprehension instead of production.</p>\n<h2>Examples</h2>\n<p>Write from Dictation audio: <em>/aɪ dəno wədaɪ wɒnt/</em> (natural connected speech for <em>\"I don't know what I want\"</em>). A listener trained on Part II Ch.6–7 recognizes the reduced <em>don't know</em> and <em>what I</em> as expected patterns and transcribes the full, correctly-spelled sentence; a listener without this training risks mishearing individual sounds as unfamiliar or omitting words that were genuinely present but reduced.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Train listening comprehension specifically on natural-speed, connected-speech audio, not only slowed or citation-form audio, mirroring the same principle established for Repeat Sentence (Part V Ch.2).</li>\n<li>For Write from Dictation, write the full, standard-spelled words you infer were intended, even if the audio realization was reduced or linked — the scoring target is the standard written form, not a phonetic transcription of what you heard.</li>\n<li>For Highlight Incorrect Words, focus attention on content words (which carry the informational load) while remembering that function-word reductions are expected and not necessarily \"incorrect\" changes.</li>\n<li>Be aware of which item types apply negative marking (Multiple Choice Multiple Answer, Highlight Incorrect Words) and avoid guessing indiscriminately on those specifically, unlike no-penalty item types where an educated guess has no downside.</li>\n</ul>\n<h2>Exercises</h2>\n<ol>\n<li>Practice Write from Dictation using natural-speed audio and check errors specifically against Part II's reduction (Ch.7) and linking (Ch.8) patterns — are your errors \"mishearing\" or \"not recognizing an expected pattern\"?</li>\n<li>For a Highlight Incorrect Words passage, listen once for content-word changes only, then a second time checking function words, and compare accuracy between the two passes.</li>\n<li>Review which Listening item types you have practiced apply negative marking, and adjust your guessing strategy for those items specifically.</li>\n</ol>\n<h2>Summary</h2>\n<ul>\n<li>The Listening section covers roughly eight item types with varying scoring models, including partial-credit, no-penalty, and negatively-marked types.</li>\n<li>Write from Dictation and Highlight Incorrect Words specifically test recognition of the connected-speech phenomena documented in Part II Ch.6–9.</li>\n<li>Training on natural-speed audio, not just careful citation-form audio, is essential — this mirrors the same principle established for Repeat Sentence (Part V Ch.2).</li>\n<li>This chapter applies the book's production-focused Part II mechanisms in reverse, as listening-decoding tools, closing the loop between speaking and listening skills.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Study.com. \"Overview of the PTE Academic Listening Section.\" https://study.com/academy/popular/overview-of-the-pte-academic-listening-section.html</li>\n<li>Edubenchmark. \"All PTE Listening Question Types: Strategies and Tips.\" https://edubenchmark.com/blog/pte-listening-question-types/ — secondary-sourced format and scoring figures; re-verify against the primary Pearson test format page before publication.</li>\n<li>Cross-reference: Part II Ch.6–9 for the connected-speech mechanisms this chapter applies in reverse.</li>\n</ol>"}]},"part6":{"label":"Part VI · 训练计划","chapters":[{"id":"part6-01_15-day-plan","title":"1. 15-Day Plan（15天冲刺计划）","meta":{"part":"Part VI — Training System","status":"Draft","accent":"General American (GA), consistent with Parts II–IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this plan, you will be able to:</p>\n<ul>\n<li>Name the three PTE Speaking enabling skills (Content, Oral Fluency,\n  Pronunciation) and state which chapters address each</li>\n<li>Correctly articulate the five highest-frequency Mandarin-to-English\n  error patterns catalogued in Part IV Ch.1</li>\n<li>Apply Part V's item-specific strategy to all ten Speaking, Writing,\n  Reading, and Listening item types under timed conditions</li>\n<li>Recognize and correctly pronounce the first 150–210 words of the\n  Part III lexicon (Batches 1–5, plus part of Batch 6)</li>\n<li>Complete one full-length mock test simulation before exam day</li>\n</ul>\n<h2>Theory</h2>\n<p>This plan assumes you have an exam booked within roughly two weeks and\ncannot cover the full book. Fifteen days is not enough time to read\nevery chapter and drill all ~500 lexicon words with the repetition\nneeded for durable recall, so this plan makes deliberate triage\nchoices rather than attempting shallow coverage of everything.</p>\n<p>Three triage principles govern the day-by-day schedule below:</p>\n<ol>\n<li><strong>Mechanism before item type.</strong> Days 1–7 cover Part II's phonetic\n   foundations and Part IV's error corpus before any Part V item-type\n   practice begins. <span class=\"tag tag-pearson\">Pearson</span> Pronunciation and Oral Fluency are\n   scored on every spoken response type (see Part I Ch.1), so a fix\n   made once in Part II pays off across Read Aloud, Repeat Sentence,\n   Describe Image, Retell Lecture, and Respond to a Situation\n   simultaneously. Practicing item-type strategy before fixing the\n   underlying articulation wastes repetitions on the wrong target.</li>\n<li><strong>Highest-frequency errors first.</strong> Part IV ranks its mistakes by\n   how often they are documented (see each Part IV chapter's ordering).\n   With limited days, this plan follows that ranking rather than\n   covering every mistake with equal time.</li>\n<li><strong>A word learned once is not learned.</strong> <span class=\"tag tag-hypothesis\">Hypothesis</span> Single-pass\n   exposure to a new word is unlikely to produce reliable recall under\n   exam pressure. Rather than front-loading all lexicon batches, this\n   plan spreads five to six batches across the full 15 days and\n   revisits each previously covered batch briefly on later days\n   (see the \"Daily Warm-Up\" note in Exercises), instead of drilling\n   each batch once and moving on.</li>\n</ol>\n<p>Given this triage, several things are deliberately <strong>not</strong> attempted in\n15 days: batches 6 (partial) through 12 of the Part III lexicon,\nand a second full pass of Part II. If your exam is more than three\nweeks away, use the 30-Day Plan instead — it\ncovers the same material with room for full lexicon coverage.</p>\n<h2>Examples</h2>\n<p>A worked example of Day 4 (Word Stress + Lexicon Batch 1), showing how\nthe daily structure combines new material with review:</p>\n<ol>\n<li><strong>Warm-up (10 min).</strong> Shadow 10 words from Day 1's material (none\n   yet at Day 4 — skip on days with no prior lexicon batch).</li>\n<li><strong>New theory (20 min).</strong> Read Part II Ch.4 (Word Stress). Note the\n   <span class=\"tag tag-linguistics\">Linguistics</span> claim that English stress is lexical (memorized per\n   word) rather than rule-predicted from spelling alone.</li>\n<li><strong>Error-corpus cross-reference (15 min).</strong> Read Part IV Ch.2 (Top\n   Stress Mistakes). Identify which of its numbered mistakes apply to\n   words you personally mis-stress — keep a running list (see Exam\n   Strategy below).</li>\n<li><strong>New lexicon batch (30 min).</strong> Work through Part III\n   <code>words_001-030.md</code>. For each word: read the IPA, say it aloud\n   against the audio model in your source dictionary (see\n   <code>REFERENCES.md</code>), then use it in the example sentence provided.</li>\n<li><strong>Log (5 min).</strong> Write down 3 words or patterns that felt hardest.\n   These feed into Day 15's targeted review.</li>\n</ol>\n<h2>Exam Strategy</h2>\n<ul>\n<li>If you miss a day, do not try to double up the next day. Cut the\n  lexicon batch for that day in half and move the rest to a spare slot\n  (Day 15 has no new material scheduled, so it can absorb overflow —\n  but only lexicon, not skipped chapters; a skipped Part II or Part V\n  chapter should be read even if late, since later days depend on it).</li>\n<li>Keep a running <strong>error log</strong>: every time you notice a mistake\n  (either self-caught or from a practice recording), write down which\n  Part IV chapter and numbered mistake it matches. Review this log for\n  10 minutes before each mock/practice session — this targets your\n  actual errors instead of generic drilling.</li>\n<li>Do not introduce new lexicon words on Day 15. <span class=\"tag tag-hypothesis\">Hypothesis</span> Reviewing\n  only previously seen material in the final 24–48 hours before a\n  timed exam is a common test-preparation practice for reducing\n  cognitive load on exam day; this plan treats it as prudent, not as a\n  proven scoring mechanism.</li>\n</ul>\n<h2>Exercises</h2>\n<p><strong>Daily Warm-Up</strong> (every day from Day 5 onward, 10 minutes before new\nmaterial): shadow 8–10 words drawn at random from <em>all</em> previously\ncovered lexicon batches, not just the most recent one. This is the\nplan's only built-in spaced-repetition mechanism given the short\ntimeframe — treat it as non-optional.</p>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Focus</th>\n<th>Materials</th>\n<th>Core Task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Orientation: how you're scored</td>\n<td>Part I Ch.1 (Scoring), Ch.2 (Pronunciation vs Accent)</td>\n<td>Read both chapters. Write a one-paragraph summary of the three enabling skills in your own words.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Consonants</td>\n<td>Part II Ch.2, Part IV Ch.1 (focus on Mistakes 1–2: θ/ð, v/w)</td>\n<td>Read Part II Ch.2. Drill the θ/ð and v/w minimal pairs from Part IV Ch.1's examples.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Vowels</td>\n<td>Part II Ch.3, Part IV Ch.5</td>\n<td>Read both. Drill the tense/lax vowel pairs Part IV Ch.5 identifies as highest-risk.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Word stress + Lexicon Batch 1</td>\n<td>Part II Ch.4, Part IV Ch.2, <code>words_001-030.md</code></td>\n<td>See worked example above.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Sentence rhythm + Lexicon Batch 2</td>\n<td>Part II Ch.5, Part IV Ch.3, <code>words_031-060.md</code></td>\n<td>Read theory, then work the lexicon batch. Start Daily Warm-Up.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Connected speech &amp; reduction</td>\n<td>Part II Ch.6–7</td>\n<td>Read both. No new lexicon batch today — use the saved time to re-drill Days 2–3's consonant/vowel targets.</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Linking &amp; incomplete plosion + Lexicon Batch 3</td>\n<td>Part II Ch.8–9, Part IV Ch.4, <code>words_061-090.md</code></td>\n<td>Completes Part II and Part IV coverage.</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Read Aloud</td>\n<td>Part V Ch.1</td>\n<td>Apply everything from Days 1–7 to 3 practice Read Aloud passages. Record yourself.</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Repeat Sentence + Fluency</td>\n<td>Part V Ch.2, Part I Ch.3</td>\n<td>Read both. Practice 5 Repeat Sentence items, focusing on the fluency mechanism from Part I Ch.3.</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Describe Image, Retell Lecture + Lexicon Batch 4</td>\n<td>Part V Ch.3–4, <code>words_091-120.md</code></td>\n<td>Read both chapters, practice one item of each type.</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Respond to a Situation, Summarize Written Text</td>\n<td>Part V Ch.5–6</td>\n<td>Read both, practice one item of each type.</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Write Email, Essay + Content</td>\n<td>Part V Ch.7–8, Part I Ch.4</td>\n<td>Read all three. Note Part V Ch.7's module-scope caveat (see chapter). Practice one Essay prompt.</td>\n</tr>\n<tr>\n<td>13</td>\n<td>Reading, Listening + Lexicon Batch 5</td>\n<td>Part V Ch.9–10, <code>words_121-150.md</code></td>\n<td>Read both chapters, practice one item of each remaining type.</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Full mock test + Common Myths</td>\n<td>Part I Ch.5, full mock simulation</td>\n<td>Read Ch.5 first (avoid last-minute panic mistakes it debunks). Then run one complete timed mock test across all sections. Log every error.</td>\n</tr>\n<tr>\n<td>15</td>\n<td>Review only — no new material</td>\n<td>Your error log; any previously covered lexicon batch</td>\n<td>Review your Day 14 error log against the relevant Part IV chapters. Light shadowing review only. Rest early.</td>\n</tr>\n</tbody>\n</table>\n<h2>Summary</h2>\n<ul>\n<li>Fifteen days cannot cover the full book — this plan triages toward\n  mechanism (Part II/IV) before item-type strategy (Part V), and\n  toward the first ~150–210 lexicon words rather than all ~500.</li>\n<li>The Daily Warm-Up (Days 5–15) is the plan's spaced-repetition\n  mechanism — do not skip it even when short on time.</li>\n<li>Keep a running error log tied to Part IV's numbered mistakes; use it\n  to target review instead of drilling generically.</li>\n<li>Day 15 is deliberately review-only, with no new lexicon or theory.</li>\n<li>If your exam is more than three weeks out, use the\n  30-Day Plan instead for fuller coverage.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Internal: Part I (<code>book/Part01_AI/</code>), Part II\n   (<code>book/Part02_Pronunciation/</code>), Part III\n   (<code>book/Part03_Lexicon/</code>), Part IV (<code>book/Part04_ErrorCorpus/</code>),\n   Part V (<code>book/Part05_Strategy/</code>) — all chapters cited above.</li>\n<li><span class=\"tag tag-hypothesis\">Hypothesis</span> claims regarding review scheduling and pre-exam rest\n   are the author's pedagogical reasoning, not sourced from Pearson\n   documentation; see <code>STYLE_GUIDE.md</code> §1 for the labeling convention.</li>\n</ol>"},{"id":"part6-02_30-day-plan","title":"2. 30-Day Plan（30天系统计划）","meta":{"part":"Part VI — Training System","status":"Draft","accent":"General American (GA), consistent with Parts II–IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this plan, you will be able to:</p>\n<ul>\n<li>Explain and apply every mechanism covered in Part II (IPA through\n  incomplete plosion) and recognize its corresponding Part IV mistake\n  pattern</li>\n<li>Correctly pronounce approximately the first 300 words of the Part\n  III lexicon (Batches 1–8), covering the book's original 300-word\n  minimum target</li>\n<li>Apply Part V's strategy chapter to every one of the ten Speaking,\n  Writing, Reading, and Listening item types, with at least three\n  timed practice attempts per item type</li>\n<li>Complete two full-length mock tests and use the error log method to\n  close the gap between them</li>\n</ul>\n<h2>Theory</h2>\n<p>Thirty days is enough time to cover Part II and Part IV completely\n(unlike the 15-Day Plan, which triages), and to reach the lexicon's\noriginal 300-word floor with room for repeated review — but not enough\nto comfortably reach the full 500-word ceiling with the spacing needed\nfor durable recall. This plan is built on three principles:</p>\n<ol>\n<li><strong>Sequential dependency order.</strong> Part II must precede Part IV in\n   any week, because Part IV's mistake descriptions assume Part II's\n   terminology (<span class=\"tag tag-linguistics\">Linguistics</span> terms like \"coda,\" \"onset,\"\n   \"diphthong monophthongization\") is already understood — this\n   mirrors the dependency Part IV's own README states. Part V depends\n   on both Part I (the scoring model motivating <em>why</em> a strategy\n   works) and Part II (the mechanism the strategy applies), so it is\n   scheduled after both.</li>\n<li><strong>Spaced lexicon exposure, not one-pass cramming.</strong> <span class=\"tag tag-hypothesis\">Hypothesis</span>\n   Each lexicon batch is revisited at least once, roughly one week\n   after first exposure, rather than seeing every word only once. This\n   plan schedules light review passes in Week 3 and Week 4 for\n   Week 1–2 batches specifically for this reason.</li>\n<li><strong>Item-type practice only after mechanism is in place.</strong> As in the\n   15-Day Plan, Part V chapters are not scheduled until the relevant\n   Part II/IV content is covered, so that item-type drilling reinforces\n   correct articulation instead of practicing existing errors at\n   higher speed.</li>\n</ol>\n<p>This plan is organized into four weeks plus a two-day final review,\neach with a consistent daily structure (see Exercises) rather than a\nunique task per day, since 30 days of fully bespoke daily tasks becomes\nhard to follow. Each week's table gives the week's chapter/lexicon\ntargets; the daily routine below tells you how to spend each day.</p>\n<h2>Examples</h2>\n<p><strong>Daily routine template</strong> (~75–90 minutes/day), used for every day in\nthis plan unless the week's table says otherwise:</p>\n<ol>\n<li><strong>Warm-up (10 min).</strong> Shadow 10 words drawn from any previously\n   completed lexicon batch (skip in Week 1 before Batch 1 exists).</li>\n<li><strong>New material (30–40 min).</strong> Read the day's assigned chapter(s)\n   from the week's table. Take notes on every <span class=\"tag tag-linguistics\">Linguistics</span> or\n   <span class=\"tag tag-pearson\">Pearson</span>-tagged claim — these are the mechanisms you'll be\n   tested on, directly or indirectly.</li>\n<li><strong>Applied practice (20–30 min).</strong> For a Part II/IV day: drill the\n   chapter's example words/minimal pairs aloud. For a Part V day:\n   complete one timed practice item of that type. For a lexicon day:\n   work through the assigned batch file.</li>\n<li><strong>Log (5 min).</strong> Add any recurring mistake to your error log, tagged\n   with the Part IV chapter/mistake number it matches.</li>\n</ol>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Do not skip the Week 3/4 review passes even if you feel confident on\n  Week 1–2 material — they exist specifically to counter the recall\n  decay that <span class=\"tag tag-hypothesis\">Hypothesis</span> untested single-exposure vocabulary is\n  expected to show under exam-day pressure.</li>\n<li>If a week's chapter load feels too heavy for one day, split it\n  across two days rather than skipping the applied-practice step —\n  reading without drilling does not change spoken output.</li>\n<li>Take both mock tests (Day 22 and Day 29) under real timed conditions,\n  in one sitting, without pausing. Compare your Day 29 error log\n  against Day 22's — recurring entries indicate a mechanism that\n  needs more than one review pass; go back to the relevant Part II/IV\n  chapter, not just the lexicon or Part V chapter.</li>\n</ul>\n<h2>Exercises</h2>\n<h3>Week 1 (Days 1–7): Foundations</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Part I Ch.1–2</td>\n<td>Orientation to scoring and the accent/pronunciation distinction.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Part II Ch.1 (IPA), Ch.2 (Consonants)</td>\n<td></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Part II Ch.3 (Vowels)</td>\n<td></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Part II Ch.4 (Word Stress)</td>\n<td></td>\n</tr>\n<tr>\n<td>5</td>\n<td>Part II Ch.5 (Sentence Rhythm)</td>\n<td></td>\n</tr>\n<tr>\n<td>6</td>\n<td>Part II Ch.6 (Connected Speech), Ch.7 (Reduction)</td>\n<td></td>\n</tr>\n<tr>\n<td>7</td>\n<td>Part II Ch.8 (Linking), Ch.9 (Incomplete Plosion)</td>\n<td>Completes Part II.</td>\n</tr>\n</tbody>\n</table>\n<h3>Week 2 (Days 8–14): Error corpus and first lexicon pass</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>8</td>\n<td>Part IV Ch.1 (Top Pronunciation Mistakes)</td>\n<td></td>\n</tr>\n<tr>\n<td>9</td>\n<td>Part IV Ch.2 (Top Stress Mistakes)</td>\n<td></td>\n</tr>\n<tr>\n<td>10</td>\n<td>Part IV Ch.3 (Top Rhythm Mistakes)</td>\n<td></td>\n</tr>\n<tr>\n<td>11</td>\n<td>Part IV Ch.4 (Top Linking Mistakes)</td>\n<td></td>\n</tr>\n<tr>\n<td>12</td>\n<td>Part IV Ch.5 (Top Vowel Mistakes)</td>\n<td>Completes Part IV.</td>\n</tr>\n<tr>\n<td>13</td>\n<td><code>words_001-030.md</code>, <code>words_031-060.md</code></td>\n<td>Lexicon Batches 1–2.</td>\n</tr>\n<tr>\n<td>14</td>\n<td><code>words_061-090.md</code>, <code>words_091-120.md</code></td>\n<td>Lexicon Batches 3–4.</td>\n</tr>\n</tbody>\n</table>\n<h3>Week 3 (Days 15–21): Item-type strategy begins</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>15</td>\n<td>Part V Ch.1 (Read Aloud)</td>\n<td>Warm-up now includes Week 2 lexicon words.</td>\n</tr>\n<tr>\n<td>16</td>\n<td>Part V Ch.2 (Repeat Sentence), Part I Ch.3 (Fluency)</td>\n<td></td>\n</tr>\n<tr>\n<td>17</td>\n<td>Part V Ch.3 (Describe Image)</td>\n<td></td>\n</tr>\n<tr>\n<td>18</td>\n<td>Part V Ch.4 (Retell Lecture)</td>\n<td></td>\n</tr>\n<tr>\n<td>19</td>\n<td><code>words_121-150.md</code>, <code>words_151-180.md</code></td>\n<td>Lexicon Batches 5–6.</td>\n</tr>\n<tr>\n<td>20</td>\n<td>Part V Ch.5 (Respond to a Situation), Ch.6 (Summarize Written Text)</td>\n<td></td>\n</tr>\n<tr>\n<td>21</td>\n<td><strong>Review day.</strong> Re-drill Week 1's hardest Part II targets from your error log. No new material.</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>Week 4 (Days 22–28): Remaining item types, full lexicon floor, mock test</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>22</td>\n<td>Full mock test #1 (Speaking + Writing + Reading + Listening)</td>\n<td>Log every error against Part IV chapter/mistake numbers.</td>\n</tr>\n<tr>\n<td>23</td>\n<td>Part V Ch.7 (Write Email), Part I Ch.4 (Content)</td>\n<td>Note Ch.7's module-scope caveat.</td>\n</tr>\n<tr>\n<td>24</td>\n<td>Part V Ch.8 (Essay)</td>\n<td></td>\n</tr>\n<tr>\n<td>25</td>\n<td>Part V Ch.9 (Reading), Ch.10 (Listening)</td>\n<td>Completes Part V.</td>\n</tr>\n<tr>\n<td>26</td>\n<td><code>words_181-210.md</code>, <code>words_211-240.md</code></td>\n<td>Lexicon Batch 7 (300-word floor now within reach).</td>\n</tr>\n<tr>\n<td>27</td>\n<td><code>words_241-270.md</code>, <code>words_271-300.md</code></td>\n<td>Lexicon Batch 8 — reaches the 300-word floor.</td>\n</tr>\n<tr>\n<td>28</td>\n<td>Review day: revisit Day 22's error log against the now-complete Part II/IV/V chapters.</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>Days 29–30: Final assessment</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>29</td>\n<td>Full mock test #2, same conditions as Day 22. Compare results directly against Day 22.</td>\n</tr>\n<tr>\n<td>30</td>\n<td>Review only. Re-read Part I Ch.5 (Common Myths) to avoid last-minute misconceptions. Rest.</td>\n</tr>\n</tbody>\n</table>\n<h2>Summary</h2>\n<ul>\n<li>Thirty days covers Part II and Part IV completely, all ten Part V\n  item types, and the lexicon's original 300-word floor (Batches 1–8).</li>\n<li>Weeks are sequenced by dependency: Part II before Part IV, both\n  before Part V.</li>\n<li>Week 3 Day 21 and Week 4 Day 28 are built-in review days — do not\n  replace them with new material.</li>\n<li>Two full mock tests (Days 22 and 29) let you measure progress\n  directly rather than relying on subjective confidence.</li>\n<li>For the remaining 200 lexicon words (Batches 9–12) and a deeper,\n  more spaced study cycle, use the 60-Day Plan\n  or 90-Day Plan.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Internal: Part I (<code>book/Part01_AI/</code>), Part II\n   (<code>book/Part02_Pronunciation/</code>), Part III\n   (<code>book/Part03_Lexicon/</code>), Part IV (<code>book/Part04_ErrorCorpus/</code>),\n   Part V (<code>book/Part05_Strategy/</code>) — all chapters cited above.</li>\n<li><span class=\"tag tag-hypothesis\">Hypothesis</span> claims regarding spaced review and recall decay are\n   the author's pedagogical reasoning, not sourced from Pearson\n   documentation; see <code>STYLE_GUIDE.md</code> §1.</li>\n</ol>"},{"id":"part6-03_60-day-plan","title":"3. 60-Day Plan（60天深化计划）","meta":{"part":"Part VI — Training System","status":"Draft","accent":"General American (GA), consistent with Parts II–IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this plan, you will be able to:</p>\n<ul>\n<li>Apply every mechanism in Part II and every mistake pattern in Part\n  IV from memory, without re-reading the source chapter</li>\n<li>Correctly pronounce the full Part III lexicon, all twelve batches\n  (Batches 1–12, 500 words — see <code>book/Part03_Lexicon/README.md</code> to\n  confirm this is still current, in case the lexicon grows further)</li>\n<li>Apply Part V's strategy chapters fluently across all ten item types,\n  with enough repetition that strategy application no longer requires\n  conscious recall of the chapter</li>\n<li>Run a minimum of three full-length mock tests and demonstrate a\n  measurable, logged reduction in repeated errors between the first\n  and last</li>\n</ul>\n<h2>Theory</h2>\n<p>Sixty days is long enough for a second full pass of the highest-value\nmaterial, not just first exposure. This plan is organized into four\ntwo-week phases rather than 60 individually scripted days, because at\nthis length a rigid day-by-day script becomes brittle — life\ninterrupts a two-month plan more often than a two-week one. Each\nphase specifies weekly targets and a repeating daily routine; you\nchoose which day of the week to do which task, as long as the week's\ntargets are met.</p>\n<p>Four design choices distinguish this plan from the 30-Day Plan:</p>\n<ol>\n<li><strong>Two full passes of Part II/IV, not one.</strong> <span class=\"tag tag-hypothesis\">Hypothesis</span> A\n   mechanism drilled once and then not revisited for six weeks is\n   likely to have decayed by the time Part V practice or the mock\n   tests need it. Phase 3 (Weeks 5–6) is a deliberate second pass of\n   Part II/IV content, timed to land roughly a month after the first.</li>\n<li><strong>The full lexicon, not just the 300-word floor.</strong> With 60 days,\n   all twelve batches (Batches 1–12) fit comfortably with review room\n   to spare, reaching the book's 500-word ceiling rather than\n   stopping at the 300-word floor as the 30-Day Plan does.</li>\n<li><strong>Three mock tests, not two.</strong> Three data points let you see\n   whether an error is trending down, not just whether it appears\n   twice. Mock tests are placed at roughly the 25%, 65%, and 95% marks\n   of the plan (Days 15, 40, 58) rather than clustered at the end.</li>\n<li><strong>A dedicated remediation week.</strong> Phase 4 (Week 8) exists\n   specifically to re-drill whatever the Day 40 mock test's error log\n   shows as still-recurring, rather than assuming Phase 3's second\n   pass fixed everything uniformly.</li>\n</ol>\n<h2>Examples</h2>\n<p><strong>Daily routine template</strong> (~50–70 minutes/day, most days):</p>\n<ol>\n<li><strong>Warm-up (10–15 min).</strong> Shadow 10–15 words drawn from across <em>all</em>\n   previously covered lexicon batches, weighted toward ones flagged in\n   your error log.</li>\n<li><strong>Core task (30–45 min).</strong> The week's assigned chapter, lexicon\n   batch, or Part V item-type practice — see the phase tables below.</li>\n<li><strong>Log (5–10 min).</strong> Update your error log. Once a week (see each\n   phase's review day), spend 20 extra minutes re-reading the Part\n   II/IV chapter behind your three most frequent log entries.</li>\n</ol>\n<p>A sample Week 5 (start of the second Part II/IV pass): re-read Part II\nCh.1–5 across the week's first four days, spending extra time only on\nchapters tied to your Day 15 mock test error log, then use the fifth\nday to re-drill the specific minimal pairs and clusters that log\nidentifies — not a full re-read of every chapter at equal depth.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>The three mock tests are checkpoints, not just practice — after\n  each one, spend a full day comparing its error log to the previous\n  mock's before continuing new material. An error that appears in all\n  three logs is your highest-priority remediation target for the\n  final two weeks.</li>\n<li>If Week 8's remediation reveals a mechanism (not just a word list)\n  still failing — e.g., a whole category like consonant clusters\n  rather than one specific word — return to the relevant Part II\n  chapter directly rather than continuing to drill Part III lexicon\n  words that share the same underlying mechanism; fixing the\n  mechanism generalizes, drilling individual words does not.</li>\n<li>Do not compress the two review weeks (Weeks 6 and 8) into the\n  content weeks if you fall behind. If you must cut something, cut\n  lexicon batch review repetitions before cutting a scheduled review\n  week — the review weeks are where retention actually gets tested.</li>\n</ul>\n<h2>Exercises</h2>\n<h3>Phase 1 — Weeks 1–2: Foundations, first pass</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Part I Ch.1–5 (all); Part II Ch.1–5</td>\n<td>Full Part I on Day 1–2, then Part II begins.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Part II Ch.6–9 (completes Part II); Part IV Ch.1–3</td>\n<td>Part IV begins as soon as Part II is complete, per the dependency in Part IV's README.</td>\n</tr>\n</tbody>\n</table>\n<h3>Phase 2 — Weeks 3–4: Error corpus complete, lexicon begins</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3</td>\n<td>Part IV Ch.4–5 (completes Part IV); <code>words_001-030.md</code> through <code>words_091-120.md</code> (Batches 1–4)</td>\n<td></td>\n</tr>\n<tr>\n<td>4</td>\n<td><code>words_121-150.md</code> through <code>words_211-240.md</code> (Batches 5–7); Part V Ch.1–2</td>\n<td>Item-type practice begins once Part II/IV are both complete.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Day 15 — Mock test #1.</strong> Run a full timed mock test at the end of\nWeek 4. Log every error against its Part IV chapter/mistake number.</p>\n<h3>Phase 3 — Weeks 5–6: Second Part II/IV pass, lexicon continues</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>5</td>\n<td>Re-read Part II Ch.1–9, weighted toward Day 15's error log; <code>words_241-270.md</code> through <code>words_301-330.md</code> (Batches 8–9)</td>\n<td>See worked example above.</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Re-read Part IV Ch.1–5, weighted toward Day 15's error log; <code>words_331-360.md</code> through <code>words_391-420.md</code> (Batches 9–10 continued)</td>\n<td>This week doubles as a review week — do not add extra new material even if ahead of schedule.</td>\n</tr>\n</tbody>\n</table>\n<h3>Phase 4 — Weeks 7–8: Remaining item types, full lexicon, remediation</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>7</td>\n<td>Part V Ch.3–10 (Describe Image through Listening); <code>words_421-450.md</code> through <code>words_481-500.md</code> (Batches 11–12, completing the 500-word lexicon)</td>\n<td>Heaviest content week — split across all seven days deliberately.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Day 40 — Mock test #2.</strong> Run at the end of Week 7. Compare its error\nlog against Day 15's.</p>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>8</td>\n<td>Remediation week: re-drill every mechanism appearing in both Day 15 and Day 40 error logs, using the relevant Part II/IV chapter directly. Do a full spaced-repetition review pass across all twelve lexicon batches, prioritizing words flagged in your error log.</td>\n<td>No new Part V material this week.</td>\n</tr>\n</tbody>\n</table>\n<h3>Final assessment</h3>\n<p><strong>Day 58 — Mock test #3.</strong> Compare against both prior mocks. An error\nappearing in all three logs needs a different remediation approach\nthan what Weeks 5–8 used — consider extending practice with the\n90-Day Plan's longer remediation cycle if it\npersists.</p>\n<p><strong>Days 59–60.</strong> Review only. Re-read Part I Ch.5 (Common Myths). Rest.</p>\n<h2>Summary</h2>\n<ul>\n<li>Sixty days allows a full second pass of Part II/IV, the complete\n  Part III lexicon as it currently stands, and three mock-test\n  checkpoints instead of one or two.</li>\n<li>The plan is organized into four two-week phases with weekly targets,\n  not individually scripted days, to tolerate schedule disruption.</li>\n<li>Weeks 6 and 8 are dedicated review/remediation weeks — protect them\n  even under time pressure.</li>\n<li>An error appearing across all three mock-test logs signals a\n  mechanism-level gap; fix it via the Part II/IV chapter, not more\n  lexicon repetition.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Internal: Part I (<code>book/Part01_AI/</code>), Part II\n   (<code>book/Part02_Pronunciation/</code>), Part III\n   (<code>book/Part03_Lexicon/</code>), Part IV (<code>book/Part04_ErrorCorpus/</code>),\n   Part V (<code>book/Part05_Strategy/</code>) — all chapters cited above.</li>\n<li><span class=\"tag tag-hypothesis\">Hypothesis</span> claims regarding spaced repetition, decay, and\n   mechanism-level remediation are the author's pedagogical reasoning,\n   not sourced from Pearson documentation; see <code>STYLE_GUIDE.md</code> §1.</li>\n</ol>"},{"id":"part6-04_90-day-plan","title":"4. 90-Day Plan（90天全面掌握计划）","meta":{"part":"Part VI — Training System","status":"Draft","accent":"General American (GA), consistent with Parts II–IV"},"html":"<h2>Learning Objectives</h2>\n<p>By the end of this plan, you will be able to:</p>\n<ul>\n<li>Demonstrate mastery of every mechanism in Part II and every mistake\n  pattern in Part IV across at least three spaced review cycles, not\n  just two passes</li>\n<li>Correctly and durably pronounce the full Part III lexicon as it\n  exists at the time of this plan, with evidence of retention weeks\n  after first exposure, not just immediately after drilling</li>\n<li>Apply Part V's strategy chapters automatically, without conscious\n  recall of the underlying chapter, across all ten item types</li>\n<li>Run a minimum of five full-length mock tests spaced across the plan\n  and show a documented downward trend in repeated errors, with a\n  final remediation cycle targeting whatever remains</li>\n</ul>\n<h2>Theory</h2>\n<p>Ninety days is long enough to treat pronunciation training the way\nskill-acquisition research treats any complex motor/cognitive skill:\nas a series of spaced cycles with built-in reassessment, not a single\nlinear pass through material. This plan differs from the 60-Day Plan\nin degree, not kind — it adds a third full review cycle and more\nmock-test checkpoints, on the <span class=\"tag tag-hypothesis\">Hypothesis</span> assumption that more\nspaced repetitions, each separated by enough time for some forgetting\nto occur, produce more durable recall than the same total study hours\ncompressed into fewer, longer sessions. This claim reflects general\nlearning-science reasoning applied by the author, not a PTE-specific\nor Pearson-sourced claim — treat the specific cycle count and spacing\nbelow as one reasonable implementation, not the only valid one.</p>\n<p>The plan is organized into six two-week phases (12 weeks ≈ 84 days)\nplus a final one-week taper (Week 13), for 90 days total. Structure:</p>\n<ol>\n<li><strong>Weeks 1–2 — Foundations, first pass.</strong> Same content as the\n   60-Day Plan's Phase 1, at a slower daily pace (more time per\n   chapter, since there is no need to rush toward an early mock test).</li>\n<li><strong>Weeks 3–4 — Error corpus complete, lexicon begins (first pass).</strong>\n   Batches 1–7, roughly matching the 60-Day Plan's pace but with more\n   built-in repetition per batch.</li>\n<li><strong>Weeks 5–6 — Lexicon continues, Part V begins.</strong> Batches 8–12,\n   completing the full 500-word lexicon, plus the first four Part V\n   chapters.</li>\n<li><strong>Weeks 7–8 — Second full review cycle.</strong> A complete re-pass of\n   Part II and Part IV (not just the weakest chapters, unlike the\n   60-Day Plan's targeted Phase 3) alongside Part V chapters.</li>\n<li><strong>Weeks 9–10 — Third review cycle, mechanism-focused.</strong> A targeted\n   (not full) re-pass driven entirely by accumulated mock-test error\n   logs, plus full completion of Part V.</li>\n<li><strong>Weeks 11–12 — Intensive mock-test cycling.</strong> Multiple full mock\n   tests with remediation between each, rather than one or two\n   checkpoints.</li>\n<li><strong>Week 13 — Taper.</strong> Reduced-intensity review only, no new\n   material, mirroring the \"review-only\" final days used in every\n   shorter plan in this Part, extended to a full week given the\n   longer runway.</li>\n</ol>\n<h2>Examples</h2>\n<p><strong>A sample third-cycle week (Week 9).</strong> Rather than re-reading all of\nPart II Ch.1–9 (as Week 7 did), Week 9 starts from the combined error\nlogs of mock tests #1 and #2 (see Exercises). If those logs show\nrecurring vowel and linking errors but no stress or rhythm errors,\nWeek 9 spends its chapter-review time only on Part II Ch.3\n(Vowels) and Ch.8 (Linking) plus their Part IV counterparts (Ch.5 and\nCh.4), instead of mechanically re-reading all nine Part II chapters\nagain. This is the core difference between the second review cycle\n(Weeks 7–8, comprehensive) and the third (Weeks 9–10, targeted): the\nsecond cycle assumes everything needs reinforcement once more; the\nthird cycle trusts the accumulated data to say what still does.</p>\n<h2>Exam Strategy</h2>\n<ul>\n<li>Treat each of the five mock tests as a checkpoint, not a\n  pass/fail event. Compare each new log against <em>all</em> prior logs, not\n  just the most recent one — an error present in mocks #1, #3, and #5\n  but absent from #2 and #4 is not \"fixed,\" it is intermittent, and\n  intermittent errors are exactly what a fatigue-inducing real exam\n  is likely to surface.</li>\n<li>If, by mock test #4 (end of Week 11), an error from Week 1–2's\n  material is still recurring, do not wait for Week 13 — pause and\n  address it immediately with a focused one-day session against the\n  original Part II/IV chapter. A 90-day plan has enough slack to\n  absorb this without abandoning the schedule.</li>\n<li>Do not let Week 13's taper become a sixth content week under\n  pressure to \"fit in more.\" <span class=\"tag tag-hypothesis\">Hypothesis</span> The taper's purpose is\n  consolidation and reduced cognitive load heading into the exam,\n  mirroring the shorter plans' final review-only days; treat it as\n  protected time, the same way Weeks 6 and 8 are protected in the\n  60-Day Plan.</li>\n</ul>\n<h2>Exercises</h2>\n<h3>Phase 1 — Weeks 1–2: Foundations, first pass</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Part I Ch.1–5 (all); Part II Ch.1–4</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Part II Ch.5–9 (completes Part II)</td>\n</tr>\n</tbody>\n</table>\n<h3>Phase 2 — Weeks 3–4: Error corpus complete, lexicon begins</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3</td>\n<td>Part IV Ch.1–5 (all, completes Part IV)</td>\n</tr>\n<tr>\n<td>4</td>\n<td><code>words_001-030.md</code> through <code>words_181-210.md</code> (Batches 1–7)</td>\n</tr>\n</tbody>\n</table>\n<h3>Phase 3 — Weeks 5–6: Lexicon continues, Part V begins</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>5</td>\n<td><code>words_211-240.md</code> through <code>words_331-360.md</code> (Batches 7 cont.–9); Part V Ch.1–2</td>\n</tr>\n<tr>\n<td>6</td>\n<td><code>words_361-390.md</code> through <code>words_481-500.md</code> (Batches 10–12, completing the 500-word lexicon); Part V Ch.3–4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Day 42 — Mock test #1.</strong> End of Week 6. Establishes the baseline\nerror log.</p>\n<h3>Phase 4 — Weeks 7–8: Second full review cycle (comprehensive)</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>7</td>\n<td>Full re-read: Part II Ch.1–9</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Full re-read: Part IV Ch.1–5; Part V Ch.5–7</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Day 56 — Mock test #2.</strong> End of Week 8. Compare against mock #1.</p>\n<h3>Phase 5 — Weeks 9–10: Third review cycle (targeted) + Part V completion</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters / Materials</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>9</td>\n<td>Targeted re-review of Part II/IV chapters implicated in mocks #1–2's combined error log only (see worked example above); Part V Ch.8–9</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Continued targeted review; Part V Ch.10 (completes Part V); full lexicon review pass (all batches, warm-up style, not first-exposure pace)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Day 70 — Mock test #3.</strong> End of Week 10. Compare against mocks #1–2.</p>\n<h3>Phase 6 — Weeks 11–12: Intensive mock-test cycling</h3>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>11</td>\n<td><strong>Day 74 — Mock test #4.</strong> Remediate immediately (see Exam Strategy) against the combined 4-mock error log. Daily lexicon warm-up continues throughout.</td>\n</tr>\n<tr>\n<td>12</td>\n<td><strong>Day 84 — Mock test #5.</strong> Final comparison against all prior mocks. Address any error appearing in 3 or more of the 5 logs directly, using the original Part II/IV chapter.</td>\n</tr>\n</tbody>\n</table>\n<h3>Week 13 — Taper</h3>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Task</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>85–87</td>\n<td>Light lexicon warm-up only (10 min/day); re-read Part I Ch.5 (Common Myths).</td>\n</tr>\n<tr>\n<td>88–89</td>\n<td>Review only, reduced intensity — skim your consolidated error log, no new drilling.</td>\n</tr>\n<tr>\n<td>90</td>\n<td>Rest. No study.</td>\n</tr>\n</tbody>\n</table>\n<h2>Summary</h2>\n<ul>\n<li>Ninety days allows three distinct review cycles (comprehensive,\n  then targeted, then intensive mock-cycling) instead of the 60-Day\n  Plan's two, plus five mock-test checkpoints instead of three.</li>\n<li>The third review cycle (Weeks 9–10) is data-driven, not a\n  mechanical re-read — it targets only what prior mock-test error\n  logs show as unresolved.</li>\n<li>Compare every new mock-test log against <em>all</em> prior logs, not just\n  the most recent, to catch intermittent (not just persistent) errors.</li>\n<li>Week 13 is a protected taper week — do not convert it into\n  additional content time even under pressure to cover more.</li>\n</ul>\n<h2>References</h2>\n<ol>\n<li>Internal: Part I (<code>book/Part01_AI/</code>), Part II\n   (<code>book/Part02_Pronunciation/</code>), Part III\n   (<code>book/Part03_Lexicon/</code>), Part IV (<code>book/Part04_ErrorCorpus/</code>),\n   Part V (<code>book/Part05_Strategy/</code>) — all chapters cited above.</li>\n<li><span class=\"tag tag-hypothesis\">Hypothesis</span> claims regarding spaced repetition cycles, error-log\n   comparison across checkpoints, and taper-week design are the\n   author's pedagogical reasoning, general to skill acquisition rather\n   than sourced from Pearson PTE documentation; see <code>STYLE_GUIDE.md</code>\n   §1 for the labeling convention.</li>\n</ol>"}]}};

    function render(words) {
      const grid = document.getElementById('grid');
      grid.innerHTML = words.map(w => `
        <div class="card" data-word="${w.word.replace(/"/g, '&quot;')}">
          <div class="card-title">${w.word}</div>
          <div class="card-ipa">${w.ipa}</div>
          <div class="card-zh">${w.zh}</div>
        </div>
      `).join('');
      document.querySelectorAll('.card').forEach(card => {
        card.onclick = () => show(card.dataset.word);
      });
    }

    function search() {
      const q = document.getElementById('search').value.toLowerCase();
      const results = LEXICON.filter(w =>
        w.word.includes(q) || w.zh.includes(q) || w.meaning.toLowerCase().includes(q)
      );
      render(results);
    }

    function show(word) {
      const w = LEXICON.find(x => x.word === word);
      if (!w) return;
      document.getElementById('modalBody').innerHTML = `
        <h2>${w.word}</h2>
        <p><b>音标:</b> ${w.ipa}</p>
        <p><b>中文:</b> ${w.zh}</p>
        <p><b>释义:</b> ${w.meaning}</p>
        <button class="btn" onclick="play('${w.word}')">🔊 播放</button>
      `;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) {
        msg('❌ 输入 key', 'error');
        return;
      }
      window.ELEVENLABS_API_KEY = key;
      localStorage.setItem('api_key', key);
      msg('✅ 已保存', 'success');
      document.getElementById('apiKey').value = '';
    }

    async function play(word) {
      const key = localStorage.getItem('api_key') || window.ELEVENLABS_API_KEY;
      if (!key) {
        msg('❌ 先保存 key', 'error');
        return;
      }

      try {
        const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'xi-api-key': key},
          body: JSON.stringify({text: word, model_id: 'eleven_monolingual_v1', voice_settings: {stability: 0.5, similarity_boost: 0.75}})
        });
        if (r.ok) {
          const blob = await r.blob();
          new Audio(URL.createObjectURL(blob)).play();
        }
      } catch(e) {
        console.error(e);
      }
    }

    async function download() {
      const key = localStorage.getItem('api_key') || window.ELEVENLABS_API_KEY;
      if (!key) {
        msg('❌ 先保存 key', 'error');
        return;
      }

      msg('⏳ 下载中...', 'success');
      let ok = 0;
      const groups = [
        {text: 'accommodate, address, analysis, annual, anxiety, apologies, architect, assessment, athlete, auxiliary'},
        {text: 'beautiful, because, borough, business, calendar, candidate, category, ceiling, century, chaos'},
        {text: 'character, characteristic, chemistry, circumstance, citizen, claustrophobic, colleague, column, comfortable, commission'},
        {text: 'commitment, committee, communicate, community, compassion, competent, competition, compliment, computer, concentrate'},
        {text: 'concussion, conference, confident, congratulations, conscious, consequence, considerable, considerate, consistency, constitute'},
        {text: 'consumption, contemporary, context, controversy, convenience, conversation, conversion, coordinate, crucial, curriculum, customer'}
      ];

      for (const g of groups) {
        try {
          const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'xi-api-key': key},
            body: JSON.stringify({text: g.text, model_id: 'eleven_monolingual_v1', voice_settings: {stability: 0.5, similarity_boost: 0.75}})
          });
          if (r.ok) ok++;
        } catch(e) {}
        await new Promise(r => setTimeout(r, 1500));
      }

      msg(`✅ 完成! ${ok}/6 批次`, 'success');
    }

    function msg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message show ' + type;
      setTimeout(() => el.className = 'message', 4000);
    }

    // 初始化
    if (localStorage.getItem('api_key')) {
      window.ELEVENLABS_API_KEY = localStorage.getItem('api_key');
    }
    render(LEXICON);
  </script>
